<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics ครู - SkillNest</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui-feedback.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
        h1, h2, h3, .logo, .logo-mock, .course-title, .card-stat-value,
        .page-title, .nav-logo, .section-title, .avatar-header-title,
        .modal-title, .stat-value, .quiz-title {
            font-family: var(--font-display, 'Space Grotesk', sans-serif);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* สีเฉพาะหน้านี้ — สร้างจากตัวแปรของ theme.css จึงเปลี่ยนตามธีมสว่าง/มืดเอง */
        :root {
            --ta-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --ta-accent-text: color-mix(in srgb, var(--primary-blue) 72%, var(--text-main));
            --ta-accent-line: color-mix(in srgb, var(--primary-blue) 35%, transparent);
            --ta-accent-bg: color-mix(in srgb, var(--primary-blue) 10%, transparent);
            --ta-accent-soft: color-mix(in srgb, var(--primary-blue) 45%, var(--bg-color));
            --ta-success-text: color-mix(in srgb, var(--success) 65%, var(--text-main));
            --ta-success-bg: color-mix(in srgb, var(--success) 12%, transparent);
            --ta-warn-text: color-mix(in srgb, var(--warning) 70%, var(--text-main));
            --ta-warn-bg: color-mix(in srgb, var(--warning) 12%, transparent);
            --ta-danger-text: color-mix(in srgb, var(--danger) 78%, var(--text-main));
            --ta-danger-bg: color-mix(in srgb, var(--danger) 10%, transparent);
            --ta-neutral-fill: color-mix(in srgb, var(--text-dim) 45%, var(--bg-color));
        }

        /* ไอคอนเส้น 1.5 และวงโฟกัสสำหรับคีย์บอร์ด (ไม่รวมแถบบนที่ app-nav.js ดูแล) */
        .sidebar svg, .main-content svg, .sd-modal svg { stroke-width: 1.5; }
        .sidebar :focus-visible, .main-content :focus-visible, .sd-modal :focus-visible { outline: 2px solid var(--primary-blue); outline-offset: 2px; }

        body {
            background-color: var(--bg-color);
            background-image: none;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Top Nav ── */
        .top-nav {
            position: fixed; top:0; left:0; right:0; height:70px;
            background: var(--nav-bg); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: grid; grid-template-columns: 1fr 2fr 1fr;
            align-items: center; padding: 0 30px; z-index: 1000;
        }
        .logo-section {
            display:flex; align-items:center; gap:10px;
            font-weight:600; font-size:1.2rem;
            text-decoration:none; color:var(--text-main);
        }
        .logo-icon { background:var(--primary-blue); padding:4px 8px; border-radius:var(--radius-sm); font-size:0.9rem; }
        .nav-right { display:flex; align-items:center; justify-content:flex-end; gap:16px; }
        .back-btn {
            background:var(--card-bg); border:1px solid var(--border-color);
            color:var(--text-dim); padding:8px 16px; border-radius:var(--radius-sm);
            cursor:pointer; font-size:0.9rem; text-decoration:none;
            display:flex; align-items:center; gap:6px; transition:0.3s;
        }
        .back-btn:hover { background:rgba(59,130,246,0.1); color:var(--text-main); border-color:var(--primary-blue); }
        .nav-user {
            background: var(--primary-blue); border:none; color:white;
            padding:8px 16px; border-radius:var(--radius-sm); font-size:0.9rem; font-weight:600; cursor:pointer;
        }

        /* ── Sidebar ── */
        .sidebar {
            position:fixed; left:0; top:70px; width:250px;
            height:calc(100vh - 70px);
            background:var(--bg-elevated);
            border-right:1px solid var(--border-color); padding:24px 12px;
        }
        .sidebar-item {
            display:flex; align-items:center; gap:10px;
            min-height:44px; padding:0 12px; color:var(--text-dim);
            text-decoration:none; border-radius:var(--radius-md);
            margin-bottom:4px; font-size:0.95rem; text-align:start; cursor:pointer;
            transition: background-color 160ms var(--ta-ease), color 160ms var(--ta-ease);
        }
        .sidebar-item .sn-icon { font-size:1.1rem; }
        .sidebar-item:hover { background:var(--card-hover); color:var(--text-main); }
        .sidebar-item.active { background:var(--active-lesson); color:var(--text-main); font-weight:500; }

        /* ── Main Content ── */
        .main-content { margin-left:250px; margin-top:70px; padding:32px; min-height:calc(100vh - 70px); min-width:0; }

        /* ── Page Header ── */
        .page-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:28px; }
        .page-title { font-size:1.75rem; font-weight:600; line-height:var(--leading-tight); }
        .page-title span { color:var(--text-dim); font-family:var(--font-body); font-size:var(--text-base); font-weight:400; letter-spacing:0; margin-left:12px; }

        /* ── Course Filter Tabs ── */
        .filter-tabs { display:flex; gap:8px; flex-wrap:wrap; }
        .filter-tab {
            display:inline-flex; align-items:center; gap:6px;
            min-height:40px; padding:0 16px; border-radius:var(--radius-md);
            border:1px solid var(--border-color); background:var(--card-bg);
            color:var(--text-dim); cursor:pointer; font-family:inherit; font-size:0.9rem; font-weight:500;
            white-space:nowrap;
            transition: background-color 160ms var(--ta-ease), color 160ms var(--ta-ease), border-color 160ms var(--ta-ease);
        }
        .filter-tab:hover { border-color:var(--line-strong); background:var(--card-hover); color:var(--text-main); }
        .filter-tab.active { background:var(--primary-2); border-color:var(--primary-2); color:#fff; }
        .filter-tab.all.active { background:var(--primary-2); }

        /* ── Stat Cards ── */
        .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:24px; }
        .stat-card {
            background:var(--card-bg); border:1px solid var(--border-color);
            border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-sm); min-width:0;
            transition: border-color 160ms var(--ta-ease);
        }
        .stat-card:hover { border-color:var(--line-strong); }
        .stat-label { color:var(--text-dim); font-size:0.9rem; margin-bottom:8px; }
        .stat-value { font-size:1.75rem; font-weight:600; line-height:var(--leading-tight); margin-bottom:6px; overflow-wrap:anywhere; }
        .stat-value small { font-family:var(--font-body); font-weight:400; letter-spacing:0; }
        .stat-sub { font-size:0.85rem; color:var(--text-dim); line-height:1.5; }
        .stat-sub.up   { color:var(--ta-success-text); }
        /* "N คนเรียนจบแล้ว" เป็นจำนวน ไม่ใช่สถานะสำเร็จ (แสดงแม้เป็น 0) → สีปกติ; "ดีมาก" (progress ≥70%) คงสีเขียว */
        .stats-grid > .stat-card:first-child .stat-sub.up { color:var(--text-dim); }
        .stat-sub.warn { color:var(--ta-warn-text); }
        .stat-sub a    { color:var(--ta-warn-text); text-decoration:underline; text-underline-offset:3px; font-weight:500; }
        .stat-sub a:hover { text-decoration-thickness:2px; }

        /* ── Grid layouts ── */
        .mid-grid   { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; margin-bottom:24px; }
        .bottom-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:24px; }
        .full-card  { margin-bottom:24px; }

        /* ── Card ── */
        .card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-sm); min-width:0; }
        /* หน้าตาเหมือนกันทั้งเป็น div หรือ h2 */
        .card-title {
            display:flex; align-items:center; flex-wrap:wrap; gap:8px;
            font-family:var(--font-display); font-size:1.05rem; font-weight:600; line-height:var(--leading-tight); letter-spacing:0;
            margin:0 0 16px; color:var(--text-main);
        }
        .card-title .sn-icon { color:var(--text-dim); }

        /* ── Progress Bars ── */
        .progress-item { margin-bottom:16px; }
        .progress-item:last-child { margin-bottom:0; }
        .progress-row { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:0.9rem; margin-bottom:8px; }
        .progress-row > span:first-child { min-width:0; overflow-wrap:anywhere; }
        .progress-row > span:last-child { flex-shrink:0; }
        .progress-row span:last-child { color:var(--text-dim); }
        .progress-track { width:100%; background:var(--line); height:8px; border-radius:var(--radius-full); overflow:hidden; }
        .progress-fill  { height:100%; border-radius:var(--radius-full); background:var(--primary-blue); transition:width 0.6s var(--ta-ease); }

        /* ── AI Card (พื้นเรียบ ขอบสีหลักบาง — ไม่มี gradient) ── */
        .ai-card {
            background: var(--card-bg);
            border: 1px solid var(--ta-accent-line); border-radius:var(--radius-lg); padding:24px;
            box-shadow: var(--shadow-sm);
        }
        .ai-card-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
        .ai-card-title  { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-family:var(--font-display); font-size:1.05rem; font-weight:600; line-height:var(--leading-tight); }
        .ai-card-title .sn-icon { color:var(--ta-accent-text); }
        .ai-badge {
            background:transparent; color:var(--text-dim); border:1px solid var(--line-strong);
            font-family:var(--font-body); font-size:0.85rem; font-weight:500; padding:1px 10px; border-radius:var(--radius-full); margin-left:0;
        }
        .btn-reanalyze {
            display:inline-flex; align-items:center; gap:6px;
            background:transparent; border:1px solid var(--ta-accent-line);
            color:var(--ta-accent-text); min-height:40px; padding:0 14px; border-radius:var(--radius-md);
            font-family:inherit; font-size:0.9rem; font-weight:500; cursor:pointer;
            transition: background-color 160ms var(--ta-ease);
        }
        .btn-reanalyze:hover { background:var(--ta-accent-bg); }
        .ai-content { font-size:0.95rem; line-height:1.8; color:var(--text-main); }
        .ai-section-head { color:var(--ta-accent-text); font-weight:600; margin-top:10px; margin-bottom:4px; }
        .ai-spinner { display:flex; align-items:center; gap:10px; color:var(--text-dim); }
        .spinner-sm { width:16px; height:16px; border:2px solid var(--primary-blue); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Student Table ── */
        .student-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
        .student-table th { color:var(--text-dim); font-weight:500; text-align:left; padding:10px 12px; border-bottom:1px solid var(--border-color); }
        .student-table td { padding:10px 12px; border-bottom:1px solid var(--line); }
        .student-table tr:last-child td { border-bottom:none; }
        .student-table tr:hover td { background:var(--card-hover); }
        .progress-pill { height:8px; background:var(--line); border-radius:var(--radius-full); overflow:hidden; width:80px; flex-shrink:0; }
        .progress-pill-fill { height:100%; border-radius:var(--radius-full); background:var(--primary-blue); }
        .status-badge { display:inline-block; font-size:0.85rem; padding:2px 10px; border-radius:var(--radius-full); font-weight:500; border:1px solid transparent; white-space:nowrap; }
        .status-done     { background:var(--ta-success-bg); color:var(--ta-success-text); border-color:color-mix(in srgb, var(--success) 25%, transparent); }
        .status-progress { background:var(--ta-accent-bg); color:var(--ta-accent-text); border-color:var(--ta-accent-line); }
        .status-new      { background:var(--card-hover); color:var(--text-dim); border-color:var(--line); }

        /* ── HW Summary ── */
        .hw-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-color); }
        .hw-row:last-child { border-bottom:none; }
        .hw-row > div:first-child { min-width:0; overflow-wrap:anywhere; }
        .hw-name { font-size:0.95rem; }
        .hw-meta { font-size:0.85rem; color:var(--text-dim); margin-top:2px; }
        .hw-stats { display:flex; gap:16px; flex-shrink:0; }
        .hw-stat { text-align:center; }
        .hw-stat-val { font-weight:700; font-size:var(--text-base); font-variant-numeric:tabular-nums; }
        .hw-stat-lbl { color:var(--text-dim); font-size:0.85rem; white-space:nowrap; }

        /* ── Skill rows (quiz per course) ── */
        .skill-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-color); font-size:0.95rem; }
        .skill-row > span:first-child { min-width:0; overflow-wrap:anywhere; }
        .skill-row:last-child { border-bottom:none; }
        .skill-badge { padding:3px 10px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:600; border:1px solid transparent; flex-shrink:0; white-space:nowrap; }
        .badge-green  { background:var(--ta-success-bg); color:var(--ta-success-text); border-color:color-mix(in srgb, var(--success) 25%, transparent); }
        .badge-yellow { background:var(--ta-warn-bg); color:var(--ta-warn-text); border-color:color-mix(in srgb, var(--warning) 25%, transparent); }
        .badge-red    { background:var(--ta-danger-bg); color:var(--ta-danger-text); border-color:color-mix(in srgb, var(--danger) 25%, transparent); }

        /* ── Loading ── */
        .page-loading { display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:16px; color:var(--text-dim); }
        .spinner-lg { width:36px; height:36px; border:3px solid var(--line-strong); border-top-color:var(--primary-blue); border-radius:50%; animation:spin 0.9s linear infinite; }

        /* ── Empty ── */
        .empty-box { text-align:center; padding:48px 24px; color:var(--text-dim); grid-column:1/-1; background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); }
        .empty-box h3 { color:var(--text-main); margin-bottom:8px; }

        /* ── Review Queue (ตรวจข้อเรียงความ) ── */
        .review-item {
            background:var(--card-hover); border:1px solid var(--border-color);
            border-radius:var(--radius-lg); padding:16px; margin-bottom:12px;
        }
        .review-item:last-child { margin-bottom:0; }
        .review-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
        .review-meta { font-size:0.85rem; color:var(--text-dim); }
        .review-question { font-weight:600; font-size:0.95rem; margin-bottom:6px; overflow-wrap:anywhere; }
        .review-answer {
            background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-md);
            padding:10px 12px; font-size:0.95rem; margin-bottom:12px; white-space:pre-wrap; line-height:1.6; overflow-wrap:anywhere;
        }
        .review-grade-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .review-grade-row input[type=number] {
            width:110px; min-height:48px; padding:0 12px; border-radius:var(--radius-md);
            border:1px solid var(--line-strong); background:var(--input-bg); color:var(--text-main);
            font-family:inherit; font-size:16px;
        }
        .review-grade-row input[type=number]:focus { border-color:var(--primary-blue); }
        .review-grade-row input[type=number]:disabled { opacity:0.7; cursor:not-allowed; }
        .btn-save-review {
            display:inline-flex; align-items:center; gap:6px;
            background:var(--primary-2); color:#fff; border:1px solid var(--primary-2); min-height:44px; padding:0 18px;
            border-radius:var(--radius-md); font-family:inherit; font-size:0.95rem; font-weight:500; cursor:pointer;
            transition: background-color 160ms var(--ta-ease);
        }
        .btn-save-review:hover { background:color-mix(in srgb, var(--primary-2) 85%, #000); }
        .btn-save-review:disabled { opacity:0.55; cursor:not-allowed; }
        /* ปุ่ม AI = ปุ่มรอง (ขอบ/ตัวหนังสือสีหลัก) — "บันทึกคะแนน" เป็นปุ่มหลักปุ่มเดียว */
        .btn-ai-review {
            display:inline-flex; align-items:center; gap:6px;
            background:transparent; color:var(--ta-accent-text); border:1px solid var(--ta-accent-line); min-height:44px; padding:0 16px;
            border-radius:var(--radius-md); font-family:inherit; font-size:0.95rem; font-weight:500; cursor:pointer;
            transition: background-color 160ms var(--ta-ease);
        }
        .btn-ai-review:hover { background:var(--ta-accent-bg); }
        .btn-ai-review:disabled { opacity:0.55; cursor:not-allowed; }
        .review-ai-suggestion {
            background:var(--ta-accent-bg); border:1px solid var(--ta-accent-line);
            border-left:3px solid var(--primary-blue); border-radius:var(--radius-md); padding:10px 12px;
            font-size:0.9rem; color:var(--text-main); margin-bottom:12px; line-height:1.6;
        }

        /* ── Student Score Table ── */
        .score-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
        .score-table th { color:var(--text-dim); font-weight:500; text-align:left; padding:10px 12px; border-bottom:1px solid var(--border-color); white-space:nowrap; }
        .score-table td { padding:10px 12px; border-bottom:1px solid var(--line); }
        .score-table tr:last-child td { border-bottom:none; }
        .score-table tr:hover td { background:var(--card-hover); }
        .score-pill { display:inline-block; padding:2px 10px; border-radius:var(--radius-full); font-size:0.85rem; font-weight:600; white-space:nowrap; }

        /* ── Quiz Question Breakdown ── */
        .qbreak-item { padding:14px 0; border-bottom:1px solid var(--border-color); }
        .qbreak-item:last-child { border-bottom:none; }
        .qbreak-q { font-weight:600; font-size:0.95rem; margin-bottom:8px; overflow-wrap:anywhere; }
        .qbreak-choice-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:0.85rem; }
        .qbreak-choice-label { width:22px; color:var(--text-dim); }
        .qbreak-bar-track { flex:1; height:8px; background:var(--line); border-radius:var(--radius-full); overflow:hidden; }
        .qbreak-bar-fill { height:100%; border-radius:var(--radius-full); background:var(--primary-blue); }
        .qbreak-bar-fill.correct-fill { background:var(--success); }
        .qbreak-pct { width:44px; text-align:right; color:var(--text-dim); font-size:0.85rem; font-variant-numeric:tabular-nums; }

        @media(max-width:1100px) {
            .stats-grid  { grid-template-columns:repeat(2,minmax(0,1fr)); }
        }
        @media(max-width:900px) {
            .mid-grid, .bottom-grid { grid-template-columns:minmax(0,1fr) !important; }
        }
        @media(max-width:768px) {
            .main-content { padding:20px; }
            /* แถบเมนูล่างจอ (theme.css): 5 เมนูต้องพอดีแถวเดียว */
            .sidebar:not(.sidebar-tabs) .sidebar-item { font-size:var(--text-xs); min-height:52px; padding:6px 4px !important; min-width:0; }
        }
        @media(max-width:374px) {
            /* จอแคบมาก: กลับไปใช้ขนาดเดิมของ theme.css เพื่อให้ 5 เมนูยังพอดีแถวเดียว */
            .sidebar:not(.sidebar-tabs) .sidebar-item { font-size:0.68rem; }
        }
        @media(max-width:560px) { .logo-section span:not(.logo-icon), .logo span:not(.logo-icon) { display:none; } .nav-right { gap:8px; } .main-content { padding:20px 16px; }
            .stats-grid { gap:12px; }
            .stat-card { padding:16px; }
            .stat-value { font-size:1.4rem; }
            .card, .ai-card { padding:20px 16px; }
            .page-header { flex-direction:column; align-items:flex-start; gap:12px; }
            .page-title span { display:block; margin:4px 0 0; }
            .hw-row { flex-wrap:wrap; }
        }

        /* ── Unified Student Table ── */
        .student-search-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
        .student-search-input {
            flex:1; min-width:200px; max-width:320px; min-height:48px; padding:0 14px;
            border-radius:var(--radius-md); border:1px solid var(--line-strong);
            background:var(--input-bg); color:var(--text-main); font-family:inherit; font-size:16px;
        }
        .student-search-input::placeholder { color:var(--text-dim); }

<script type="module">
import { supabase } from './supabase.js';

// ── State ──
let currentUser  = null;
let allCourses   = [];
let allEnrolls   = [];
let allSubs      = [];
let allQuiz      = [];
let selectedId   = 'all';
let barChart     = null;
let pieChart     = null;
let quizChart    = null;

// อ่านค่าสีจาก CSS variable ของธีมปัจจุบัน เพื่อให้กราฟ Chart.js เปลี่ยนตามธีมด้วย
function themeVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
}

// ── Init ──
async function init() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { window.location.href = 'login-page/login.html'; return; }

    const { data: profile } = await supabase.from('users').select('*').eq('id', user.id).single();
    if (!profile || profile.user_type !== 'teacher') { window.location.href = 'dashboard.html'; return; }

    currentUser = user;

    await fetchAll();
    document.getElementById('pageLoading').style.display = 'none';
    renderPage();
    runAI();
}

// ── Fetch ──
async function fetchAll() {
    const { data: courses } = await supabase.from('courses').select('*').eq('creator_id', currentUser.id).order('created_at', { ascending: false });
    allCourses = courses || [];
    if (!allCourses.length) return;

    const ids = allCourses.map(c => c.id);
    const [{ data: e }, { data: s }, { data: q }] = await Promise.all([
        supabase.from('enrollments')
            .select('*, users(id, first_name, last_name, email, user_type)')
            .in('course_id', ids),
        supabase.from('submissions').select('*').in('course_id', ids),
        supabase.from('quiz_scores').select('*').in('course_id', ids)
    ]);

    // ไม่ต้องกรองอะไรเพิ่ม — ครูที่ enroll คอร์สตัวเองถูกลบออกจาก DB แล้ว
    // แค่กรอง null ออก
    allEnrolls = (e || []).filter(en => en.user_id && en.course_id);
    allSubs    = s || [];
    allQuiz    = q || [];
}

// ── Filter ──
function filtered() {
    if (selectedId === 'all') return { enrolls: allEnrolls, subs: allSubs, quiz: allQuiz, courses: allCourses };
    return {
        enrolls: allEnrolls.filter(x => x.course_id === selectedId),
        subs:    allSubs.filter(x => x.course_id === selectedId),
        quiz:    allQuiz.filter(x => x.course_id === selectedId),
        courses: allCourses.filter(x => x.id === selectedId)
    };
}

        </div>

        <h2 class="card-title"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span> รายละเอียดคำถาม Quiz รายข้อ</h2>

window.selectCourse = function(id, btn) {
    selectedId = id;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateAll();
    runAI();
};

// ── Stats ──

    const avgQuiz = quiz.length ? Math.round(quiz.reduce((s,q)=>s+(q.pct||0),0)/quiz.length) : 0;
    const pending = subs.filter(s => s.status==='submitted').length;

    document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
        <div class="stat-label">นักเรียนทั้งหมด</div>
        <div class="stat-value">${enrolls.length} <small style="font-size:var(--text-base);color:var(--text-dim)">คน</small></div>

    </div>
    <div class="stat-card">
        <div class="stat-label">คะแนน Quiz เฉลี่ย</div>
        <div class="stat-value">${quiz.length?avgQuiz:'—'} <small style="font-size:var(--text-base);color:var(--text-dim)">${quiz.length?'%':''}</small></div>

// ── Progress List ──
function renderProgressList(enrolls, courses) {
    const el = document.getElementById('courseProgressList');
    if (!courses.length) {
        el.innerHTML = emptyState({
            title: 'ยังไม่มีคอร์ส',
            text: 'สร้างคอร์สแรกของคุณก่อนเพื่อดูความคืบหน้าของนักเรียน',
            linkText: 'สร้างคอร์สใหม่ →',
            linkHref: 'create-course.html'
        });
        return;
    }

    const colors = ['var(--primary-blue)'];
    el.innerHTML = courses.map((c,i) => {
        const ce   = enrolls.filter(e => e.course_id===c.id);
        const avg  = ce.length ? Math.round(ce.reduce((s,e)=>s+(e.progress||0),0)/ce.length) : 0;
        const done = ce.filter(e=>(e.progress||0)>=100).length;
        return `<div class="progress-item">
            <div class="progress-row">
                <span>${snEscapeHtml(c.title)}</span>
                <span style="display:flex;gap:8px;align-items:center;">
                    <span style="font-size:var(--text-xs);color:var(--text-dim);"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> ${done}/${ce.length} คน</span>
                    <span>${avg}%</span>
                </span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${avg}%;background:${avg >= 100 ? 'var(--success)' : colors[i%colors.length]}"></div></div>
        </div>`;
    }).join('');
}

// ── Pie Chart ──
function renderPie(enrolls) {
    const done   = enrolls.filter(e=>(e.progress||0)>=100).length;
    const inProg = enrolls.filter(e=>(e.progress||0)>0&&(e.progress||0)<100).length;
    const fresh  = enrolls.filter(e=>(e.progress||0)===0).length;
    const ctx = document.getElementById('pieChart');
    if (!ctx) return;
    if (pieChart) pieChart.destroy();
    pieChart = new Chart(ctx, {
        type:'doughnut',
        data:{
            labels:['เรียนจบ','กำลังเรียน','ยังไม่เริ่ม'],
            datasets:[{ data:[done,inProg,fresh], backgroundColor:[themeVar('--success','#34D399'), themeVar('--primary-blue','#6366F1'), themeVar('--text-dim','#8B92AE')], borderWidth:0, hoverOffset:6 }]
        },
        options:{
            responsive:true, maintainAspectRatio:false, cutout:'65%',
            plugins:{ legend:{ position:'bottom', labels:{ color:themeVar('--text-dim','#a0a0ba'), font:{ size:11 }, padding:16 } } }
        }
    });
}

// ── รูปประกอบ: รับเฉพาะลิงก์ https:// (escape แล้ว) — อย่างอื่นไม่แสดงรูป ──
function safeHttpsUrl(u) {
    if (typeof u !== 'string') return '';
    const v = u.trim();
    return /^https:\/\//i.test(v) ? snEscapeHtml(v) : '';
}

// ── ชื่อผู้ใช้จาก user_id (lookup จาก allEnrolls ที่ join ตาราง users มาแล้ว) ──
function getUserName(userId) {
    const en = allEnrolls.find(e => e.user_id === userId);
    if (en && en.users) {
        const u = en.users;
        return `${u.first_name||''} ${u.last_name||''}`.trim() || u.email || userId.slice(0,8)+'…';
    }
    return userId.slice(0,8)+'…';
}

// ── Review Queue: ข้อตอบสั้น/เรียงความที่รอตรวจ (ทั้งจาก Quiz และการบ้านแบบฟอร์ม) ──
function renderReviewQueue(subs, quiz, courses) {
    const card = document.getElementById('reviewQueueCard');
    const listEl = document.getElementById('reviewQueueList');
    const countEl = document.getElementById('reviewQueueCount');

    const items = [];

    quiz.filter(q => q.needs_review).forEach(qs => {
        const course = allCourses.find(c => c.id === qs.course_id);
        const qDef = (course?.quiz || []);
        (qs.answers || []).forEach((a, ai) => {
            if (a.type === 'short_answer' && a.needsReview) {
                const def = qDef.find(q => q.question === a.question);
                items.push({
                    kind: 'quiz', userId: qs.user_id, courseId: qs.course_id, courseTitle: course?.title || '',
                    question: a.question, answerText: a.answerText, maxPoints: a.maxPoints || 1, answerIndex: ai,
                    sampleAnswer: def?.sampleAnswer || ''
                });
            }
        });
    });

    subs.filter(s => s.submission_kind === 'form' && Array.isArray(s.form_answers)).forEach(sub => {
        const course = allCourses.find(c => c.id === sub.course_id);
        const hwDef = course?.homework?.[sub.homework_index];
        const qDef = hwDef?.formQuestions || [];
        (sub.form_answers || []).forEach((a, ai) => {
            if (a.type === 'short_answer' && a.needsReview) {
                const def = qDef.find(q => q.question === a.question);
                items.push({
                    kind: 'submission', rowId: sub.id, userId: sub.user_id, courseId: sub.course_id, courseTitle: course?.title || '',
                    homeworkTitle: sub.homework_title, question: a.question, answerText: a.answerText,
                    maxPoints: a.maxPoints || 1, answerIndex: ai,
                    sampleAnswer: def?.sampleAnswer || ''
                });
            }
        });
    });

    if (!items.length) { card.style.display = 'none'; window._reviewQueueItems = []; return; }
    card.style.display = 'block';
    countEl.textContent = `${items.length} ข้อ`;
    window._reviewQueueItems = items;

    listEl.innerHTML = items.map((it, i) => `
        <div class="review-item">
            <div class="review-header">
                <div>
                    <div style="font-weight:600;">${snEscapeHtml(getUserName(it.userId))}</div>
                    <div class="review-meta">${snEscapeHtml(it.courseTitle)}${it.homeworkTitle ? ' • การบ้าน: ' + snEscapeHtml(it.homeworkTitle) : ' • Quiz'}</div>
                </div>
                <div class="review-meta">เต็ม ${snEscapeHtml(it.maxPoints)} คะแนน</div>
            </div>
            <div class="review-question">${snEscapeHtml(it.question)}</div>
            <div class="review-answer">${snEscapeHtml(it.answerText || '(ไม่ได้ตอบ)')}</div>
            <div id="review-ai-note-${i}" aria-live="polite"></div>
            <div class="review-grade-row">
                <label for="review-score-${i}" style="font-size:0.85rem;color:var(--text-dim);">ให้คะแนน:</label>
                <input type="number" min="0" max="${Number(it.maxPoints) || 0}" step="0.5" id="review-score-${i}" placeholder="0-${snEscapeHtml(it.maxPoints)}">
                <button type="button" class="btn-ai-review" onclick="aiGradeReviewItem(${i})" id="review-ai-btn-${i}"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> ให้ AI ช่วยตรวจ</button>
                <button type="button" class="btn-save-review" onclick="saveReviewItem(${i})">บันทึกคะแนน</button>
                <span id="review-status-${i}" role="status" style="font-size:0.8rem;color:var(--ta-success-text);"></span>
            </div>
        </div>
    `).join('');
}

window.aiGradeAllReviewItems = async function() {
    const items = window._reviewQueueItems || [];
    if (!items.length) return;
    const bulkBtn = document.getElementById('btnAiGradeAll');
    bulkBtn.disabled = true;
    const originalHtml = bulkBtn.innerHTML;
    for (let i = 0; i < items.length; i++) {
        bulkBtn.innerHTML = `<span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> กำลังตรวจ ${i+1}/${items.length}...`;
        // ข้ามข้อที่บันทึกไปแล้ว (input ถูก disable หลังกดบันทึกคะแนน)
        const input = document.getElementById(`review-score-${i}`);
        if (input && input.disabled) continue;
        try {
            await aiGradeReviewItem(i);
        } catch (e) { /* ข้ามไปข้อถัดไปถ้าข้อใดข้อหนึ่ง error */ }
    }
    bulkBtn.disabled = false;
    bulkBtn.innerHTML = originalHtml;
};

window.aiGradeReviewItem = async function(i) {
    const it = window._reviewQueueItems[i];
    const btn = document.getElementById(`review-ai-btn-${i}`);
    const noteEl = document.getElementById(`review-ai-note-${i}`);
    btn.disabled = true;
    btn.textContent = 'AI กำลังตรวจ...';
    noteEl.innerHTML = '';
    try {
        const res = await fetch('/api/ai?fn=grade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                question: it.question,
                answerText: it.answerText,
                sampleAnswer: it.sampleAnswer,
                maxPoints: it.maxPoints
            })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById(`review-score-${i}`).value = data.suggestedScore;
        noteEl.innerHTML = `
            <div class="review-ai-suggestion">
                <span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> AI เสนอ ${snEscapeHtml(data.suggestedScore)}/${snEscapeHtml(it.maxPoints)} คะแนน — ${snEscapeHtml(data.reasoning || '')}
                <span style="display:block;color:var(--text-dim);font-size:0.85rem;margin-top:3px;">เป็นแค่ข้อเสนอแนะ ตรวจสอบและแก้คะแนนก่อนกด "บันทึกคะแนน" ได้ตามดุลยพินิจ</span>
            </div>`;
    } catch (e) {
        noteEl.innerHTML = `<div class="review-ai-suggestion" style="color:var(--ta-danger-text);border-color:color-mix(in srgb,var(--danger) 30%,transparent);border-left-color:var(--danger);background:var(--ta-danger-bg);">เกิดข้อผิดพลาด: ${snEscapeHtml(e.message)}</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> ให้ AI ช่วยตรวจ';
    }
};

window.saveReviewItem = async function(i) {
    const it = window._reviewQueueItems[i];
    const input = document.getElementById(`review-score-${i}`);
    const statusEl = document.getElementById(`review-status-${i}`);
    const btn = input.closest('.review-grade-row').querySelector('.btn-save-review');
    const points = parseFloat(input.value);
    if (isNaN(points) || points < 0 || points > it.maxPoints) {
        toast(`กรุณาใส่คะแนน 0-${it.maxPoints}`, 'warning');
        return;
    }
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
        if (it.kind === 'quiz') await saveQuizReview(it, points);
        else await saveSubmissionReview(it, points);
        statusEl.innerHTML = '<span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> บันทึกแล้ว';
        btn.textContent = 'บันทึกแล้ว';
        input.disabled = true;
        await fetchAll();
        updateAll();
    } catch(e) {
        toast('เกิดข้อผิดพลาด: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = 'บันทึกคะแนน';
    }
};

async function saveQuizReview(it, points) {
    const row = allQuiz.find(q => q.user_id === it.userId && q.course_id === it.courseId);
    if (!row) throw new Error('ไม่พบข้อมูล quiz');
    const answers = (row.answers || []).map((a, idx) => idx === it.answerIndex
        ? { ...a, pointsEarned: points, needsReview: false, isCorrect: points >= (a.maxPoints || 1) }
        : a);
    const newScore = answers.reduce((s,a) => s + (a.pointsEarned || 0), 0);
    const newPct = row.total > 0 ? Math.round((newScore/row.total)*100) : 0;
    const stillPending = answers.some(a => a.needsReview);
    const { error } = await supabase.from('quiz_scores')
        .update({ answers, score: newScore, pct: newPct, needs_review: stillPending })
        .eq('user_id', row.user_id).eq('course_id', row.course_id);
    if (error) throw error;
}

async function saveSubmissionReview(it, points) {
    const row = allSubs.find(s => s.id === it.rowId);
    if (!row) throw new Error('ไม่พบข้อมูลการส่งงาน');
    const answers = (row.form_answers || []).map((a, idx) => idx === it.answerIndex
        ? { ...a, pointsEarned: points, needsReview: false, isCorrect: points >= (a.maxPoints || 1) }
        : a);
    const maxTotal = answers.reduce((s,a) => s + (a.maxPoints || 1), 0);
    const earned = answers.reduce((s,a) => s + (a.pointsEarned || 0), 0);
    const course = allCourses.find(c => c.id === row.course_id);
    const hw = course?.homework?.[row.homework_index];
    const scaledGrade = maxTotal > 0 ? Math.round((earned/maxTotal) * (hw?.maxScore || 100)) : 0;
    const stillPending = answers.some(a => a.needsReview);
    const { error } = await supabase.from('submissions')
        .update({
            form_answers: answers, needs_review: stillPending,
            status: stillPending ? 'submitted' : 'graded',
            grade: stillPending ? null : scaledGrade
        })
        .eq('id', row.id);
    if (error) throw error;
}

// ── Student Table (รวม Progress + Quiz + การบ้าน) — คลิกแถวเพื่อดูรายละเอียดรายบุคคล ──
function renderStudentScoreTable(enrolls, subs, quiz, courses) {
    const el = document.getElementById('studentScoreTable');
    const countEl = document.getElementById('scoreTableCount');
    if (!enrolls.length) {
        el.innerHTML = emptyState({
            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>',
            title: 'ยังไม่มีนักเรียน',
            text: 'รายชื่อนักเรียนที่สมัครเรียนจะมาแสดงที่นี่'
        });
        countEl.textContent = '';
        return;
    }

    const searchTerm = (document.getElementById('studentSearchInput')?.value || '').trim().toLowerCase();
    let filteredEnrolls = enrolls;
    if (searchTerm) {
        filteredEnrolls = enrolls.filter(e => {
            const u = e.users;
            const name = u ? `${u.first_name||''} ${u.last_name||''} ${u.email||''}`.toLowerCase() : '';
            return name.includes(searchTerm);
        });
    }
    countEl.textContent = searchTerm ? `${filteredEnrolls.length}/${enrolls.length} คน` : `${enrolls.length} คน`;

    if (!filteredEnrolls.length) {
        el.innerHTML = '<div style="color:var(--text-dim);padding:12px 0;">ไม่พบนักเรียนที่ค้นหา</div>';
        return;
    }

    const rows = filteredEnrolls.slice(0, 30).map(e => {
        const u = e.users;
        const name = u ? `${u.first_name||''} ${u.last_name||''}`.trim() || u.email : e.user_id.slice(0,8)+'…';
        const initial = name.trim().charAt(0).toUpperCase() || '?';
        const course = allCourses.find(c => c.id === e.course_id);
        const pct = e.progress || 0;
        const qz = quiz.find(q => q.user_id === e.user_id && q.course_id === e.course_id);
        const mySubs = subs.filter(s => s.user_id === e.user_id && s.course_id === e.course_id);
        const gradedSubs = mySubs.filter(s => s.status === 'graded' && s.grade != null);
        const hwAvg = gradedSubs.length ? Math.round(gradedSubs.reduce((s,x) => s+(x.grade||0), 0)/gradedSubs.length) : null;
        const pendingCount = mySubs.filter(s => s.status === 'submitted').length + (qz && qz.needs_review ? 1 : 0);
        const statusCls = pct>=100?'status-done':pct>0?'status-progress':'status-new';
        const statusLbl = pct>=100?'จบแล้ว':pct>0?'กำลังเรียน':'ยังไม่เริ่ม';

        const quizBadge = qz ? `<span class="score-pill" style="${(qz.pct||0)>=75?'background:var(--ta-success-bg);color:var(--ta-success-text);border:1px solid color-mix(in srgb,var(--success) 25%,transparent);':(qz.pct||0)>=40?'background:var(--ta-warn-bg);color:var(--ta-warn-text);border:1px solid color-mix(in srgb,var(--warning) 25%,transparent);':'background:var(--ta-danger-bg);color:var(--ta-danger-text);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);'}">${snEscapeHtml(qz.score)}/${snEscapeHtml(qz.total)} (${snEscapeHtml(qz.pct)}%)</span>` : '<span style="color:var(--text-dim);">—</span>';
        const hwBadge = hwAvg !== null ? `<span class="score-pill" style="background:var(--ta-accent-bg);color:var(--ta-accent-text);border:1px solid var(--ta-accent-line);">${hwAvg}%</span>` : '<span style="color:var(--text-dim);">—</span>';
        const pendingBadge = pendingCount > 0 ? `<span class="score-pill" style="background:var(--ta-warn-bg);color:var(--ta-warn-text);border:1px solid color-mix(in srgb,var(--warning) 25%,transparent);">${pendingCount} รอตรวจ</span>` : '<span style="color:var(--text-dim);">—</span>';

        return `<tr class="row-clickable" onclick="openStudentDetail(${snEscapeHtml(JSON.stringify(e.user_id))})">
            <td><button type="button" class="sd-name-cell sd-name-btn" onclick="event.stopPropagation(); openStudentDetail(${snEscapeHtml(JSON.stringify(e.user_id))})"><span class="sd-avatar">${snEscapeHtml(initial)}</span>${snEscapeHtml(name)}</button></td>
            ${selectedId==='all' ? `<td style="font-size:0.85rem;color:var(--text-dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${snEscapeHtml(course?.title||'')}</td>` : ''}
            <td><div style="display:flex;align-items:center;gap:8px;"><div class="progress-pill"><div class="progress-pill-fill" style="width:${Number(pct) || 0}%"></div></div><span style="font-size:0.85rem;color:var(--text-dim);">${snEscapeHtml(pct)}%</span></div></td>
            <td><span class="status-badge ${statusCls}">${statusLbl}</span></td>
            <td>${quizBadge}</td>
            <td>${hwBadge}</td>
            <td>${pendingBadge}</td>
        </tr>`;
    }).join('');

    el.innerHTML = `<div style="overflow-x:auto;"><table class="score-table">
        <thead><tr>
            <th>ชื่อ</th>
            ${selectedId==='all'?'<th>คอร์ส</th>':''}
            <th>Progress</th><th>สถานะ</th><th>Quiz</th><th>การบ้านเฉลี่ย</th><th>รอตรวจ</th>
        </tr></thead>
        <tbody>${rows}</tbody>
    </table>
    ${filteredEnrolls.length>30?`<div style="text-align:center;color:var(--text-dim);font-size:0.85rem;padding:10px 0;">และอีก ${filteredEnrolls.length-30} คน — ลองค้นหาชื่อเพื่อดูเฉพาะคนที่ต้องการ</div>`:''}</div>`;
}

// ── Student Detail Modal: วิเคราะห์รายบุคคล ครบทุกคอร์สที่เรียนกับครูคนนี้ ──
window.openStudentDetail = function(userId) {
    const myEnrolls = allEnrolls.filter(e => e.user_id === userId);
    if (!myEnrolls.length) return;
    const u = myEnrolls[0].users;
    const name = u ? `${u.first_name||''} ${u.last_name||''}`.trim() || u.email : userId.slice(0,8)+'…';
    const initial = name.trim().charAt(0).toUpperCase() || '?';

    document.getElementById('sdAvatarLg').textContent = initial;
    document.getElementById('sdName').textContent = name;
    document.getElementById('sdEmail').textContent = u?.email || '';

    // สรุปภาพรวมข้ามทุกคอร์สของนักเรียนคนนี้
    const myQuizAll = allQuiz.filter(q => q.user_id === userId);
    const mySubsAll = allSubs.filter(s => s.user_id === userId);
    const avgProgress = myEnrolls.length ? Math.round(myEnrolls.reduce((s,e)=>s+(e.progress||0),0)/myEnrolls.length) : 0;
    const totalPending = mySubsAll.filter(s=>s.status==='submitted').length + myQuizAll.filter(q=>q.needs_review).length;
    const totalWatchMin = Math.round(myEnrolls.reduce((s,e)=>s+(e.watch_seconds||0),0)/60);

    let html = `
    <div class="sd-summary-grid">
        <div class="sd-summary-card"><div class="sd-summary-label">คอร์สที่เรียน</div><div class="sd-summary-value">${myEnrolls.length}</div></div>
        <div class="sd-summary-card"><div class="sd-summary-label">Progress เฉลี่ย</div><div class="sd-summary-value">${avgProgress}%</div></div>
        <div class="sd-summary-card"><div class="sd-summary-label">เวลาเรียนรวม</div><div class="sd-summary-value">${totalWatchMin >= 60 ? Math.round(totalWatchMin/60*10)/10+' ชม.' : totalWatchMin+' น.'}</div></div>
        <div class="sd-summary-card"><div class="sd-summary-label">รอตรวจ</div><div class="sd-summary-value" style="color:${totalPending>0?'var(--ta-warn-text)':'inherit'};">${totalPending}</div></div>
    </div>
    <div style="margin-bottom:24px;">
        <div style="font-weight:600;font-size:0.95rem;margin-bottom:8px;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> AI วิเคราะห์นักเรียนคนนี้</div>
        <div id="sdAiSummary" style="background:var(--ta-accent-bg);border:1px solid var(--ta-accent-line);border-radius:var(--radius-lg);padding:14px 16px;">
            <button type="button" onclick="analyzeStudentWithAI(${snEscapeHtml(JSON.stringify(userId))})"
                style="background:transparent;border:1px solid var(--ta-accent-line);color:var(--ta-accent-text);
                min-height:44px;padding:0 1rem;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:600;">
                <span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> ให้ AI วิเคราะห์นักเรียนคนนี้
            </button>
            <div style="font-size:0.85rem;color:var(--text-dim);margin-top:6px;">สรุปภาพรวม • เทียบกับเพื่อนร่วมคอร์ส • ประเมินความเสี่ยง • คำแนะนำสำหรับอาจารย์</div>
        </div>
    </div>`;

    // รายละเอียดต่อคอร์ส
    html += myEnrolls.map(e => {
        const course = allCourses.find(c => c.id === e.course_id);
        if (!course) return '';
        const pct = e.progress || 0;
        const qz = myQuizAll.find(q => q.course_id === e.course_id);
        const courseSubs = mySubsAll.filter(s => s.course_id === e.course_id);

        // Quiz breakdown รายข้อ (เฉพาะของนักเรียนคนนี้) — แบ่งเป็นกลุ่มตามบท/ทั้งคอร์ส ให้รีเซ็ตแยกส่วนได้
        let quizHtml = '<div class="sd-empty">ยังไม่ได้ทำ Quiz ของคอร์สนี้</div>';
        if (qz && Array.isArray(qz.answers) && qz.answers.length > 0) {
            const scopeGroups = {};
            qz.answers.forEach(a => {
                const key = a.lessonIndex == null ? 'global' : String(a.lessonIndex);
                (scopeGroups[key] = scopeGroups[key] || []).push(a);
            });

            quizHtml = `<div style="margin-bottom:8px;font-size:0.85rem;">คะแนนรวมทั้งหมด: <strong>${snEscapeHtml(qz.score)}/${snEscapeHtml(qz.total)}</strong> (${snEscapeHtml(qz.pct)}%)${qz.needs_review?' • มีข้อรอตรวจ':''}</div>`;
            quizHtml += Object.entries(scopeGroups).map(([key, answers]) => {
                const lessonIdx = key === 'global' ? null : parseInt(key);
                const scopeLabel = lessonIdx == null
                    ? '<span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a6 6 0 00-6 6c0 4 6 12 6 12s6-8 6-12a6 6 0 00-6-6z"/><circle cx="12" cy="8" r="2"/></svg></span> ทั้งคอร์ส'
                    : (course.lessons?.[lessonIdx]?.title ? `บทที่ ${lessonIdx+1}: ${snEscapeHtml(course.lessons[lessonIdx].title)}` : `บทที่ ${lessonIdx+1}`);
                const scopeScore = answers.reduce((s,a)=>s+(Number(a.pointsEarned)||0),0);
                const scopeMax   = answers.reduce((s,a)=>s+(Number(a.maxPoints)||1),0);
                const qaItems = answers.map(a => {
                    let resultLabel, resultCls;
                    if (a.needsReview) { resultLabel = 'รอครูตรวจ'; resultCls = 'pending'; }
                    else if (a.isCorrect) { resultLabel = `ถูก (+${snEscapeHtml(a.pointsEarned)}/${snEscapeHtml(a.maxPoints)})`; resultCls = 'correct'; }
                    else { resultLabel = `ผิด (0/${snEscapeHtml(a.maxPoints)})`; resultCls = 'wrong'; }
                    const answerShown = a.answerText || a.selected || (a.selectedMultiple||[]).join(', ') || '(ไม่ได้ตอบ)';
                    const imgHtml = safeHttpsUrl(a.imageUrl) ? `<img alt="รูปประกอบ" src="${safeHttpsUrl(a.imageUrl)}" style="max-width:220px;max-height:140px;border-radius:var(--radius-sm);display:block;margin:0.4rem 0;">` : '';
                    return `<div class="sd-qa-item">
                        <div class="sd-qa-q">${snEscapeHtml(a.question)}</div>
                        ${imgHtml}
                        <div class="sd-qa-answer">คำตอบ: ${snEscapeHtml(answerShown)} — <span class="sd-qa-result ${resultCls}">${resultLabel}</span></div>
                    </div>`;
                }).join('');
                return `<div style="margin-bottom:12px;padding:10px 12px;background:var(--card-bg);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
                        <div style="font-weight:600;font-size:0.85rem;">${scopeLabel} — ${scopeScore}/${scopeMax}</div>
                        <button type="button" onclick="resetQuizScope(${snEscapeHtml(JSON.stringify(userId))},${snEscapeHtml(JSON.stringify(e.course_id))},${lessonIdx==null?'null':lessonIdx})"
                            style="background:var(--ta-danger-bg);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);color:var(--ta-danger-text);
                            min-height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:0.85rem;white-space:nowrap;">
                            <span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></span> รีเซ็ตให้ทำใหม่
                        </button>
                    </div>
                    ${qaItems}
                </div>`;
            }).join('');
        }

        // การบ้านของคอร์สนี้
        let hwHtml = '<div class="sd-empty">ยังไม่มีการส่งการบ้านในคอร์สนี้</div>';
        if (courseSubs.length) {
            hwHtml = courseSubs.map(s => {
                const hwDef = course.homework?.[s.homework_index];
                const title = hwDef?.title || s.homework_title || 'การบ้าน';
                const badge = s.status === 'graded'
                    ? `<span class="status-badge status-done">${snEscapeHtml(s.grade ?? 0)}/${snEscapeHtml(hwDef?.maxScore || 100)}</span>`
                    : `<span class="status-badge status-progress">รอตรวจ</span>`;
                return `<div class="sd-hw-item">
                    <div class="sd-hw-title">${snEscapeHtml(title)}${s.comment ? `<div class="sd-hw-comment"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></span> ${snEscapeHtml(s.comment)}</div>` : ''}</div>
                    ${badge}
                </div>`;
            }).join('');
        }

        return `
        <div class="sd-course-card">
            <div class="sd-course-title">
                <span>${snEscapeHtml(course.title)}</span>
                <span class="sd-course-progress-badge">Progress ${snEscapeHtml(pct)}%</span>
            </div>
            <div class="sd-subsection">
                <div class="sd-subsection-title">Quiz</div>
                ${quizHtml}
            </div>
            <div class="sd-subsection">
                <div class="sd-subsection-title">การบ้าน</div>
                ${hwHtml}
            </div>
        </div>`;
    }).join('');

    document.getElementById('sdBody').innerHTML = html;
    document.getElementById('sdModalOverlay').classList.add('open');
};

// AI วิเคราะห์นักเรียนรายบุคคล — สรุปภาพรวม + เทียบกับเพื่อนร่วมคอร์สเดียวกัน + ประเมินความเสี่ยง + คำแนะนำ
window.analyzeStudentWithAI = async function(userId) {
    const box = document.getElementById('sdAiSummary');
    if (!box) return;
    box.innerHTML = '<div class="ai-spinner"><div class="spinner-sm"></div><span>AI กำลังวิเคราะห์...</span></div>';

    const myEnrolls = allEnrolls.filter(e => e.user_id === userId);
    const myQuizAll = allQuiz.filter(q => q.user_id === userId);
    const mySubsAll = allSubs.filter(s => s.user_id === userId);
    const myCourseIds = myEnrolls.map(e => e.course_id);

    // เพื่อนร่วมคอร์สเดียวกัน (ไม่รวมนักเรียนคนนี้เอง) — ใช้เทียบค่าเฉลี่ยแบบยุติธรรม (คอร์สเดียวกันเท่านั้น ไม่ใช่ค่าเฉลี่ยรวมทุกคอร์สในระบบ)
    const peerEnrolls = allEnrolls.filter(e => myCourseIds.includes(e.course_id) && e.user_id !== userId);
    const peerQuiz     = allQuiz.filter(q => myCourseIds.includes(q.course_id) && q.user_id !== userId);
    const classAvgProgress = peerEnrolls.length ? Math.round(peerEnrolls.reduce((s,e)=>s+(e.progress||0),0)/peerEnrolls.length) : null;
    const classAvgQuiz     = peerQuiz.length ? Math.round(peerQuiz.reduce((s,q)=>s+(q.pct||0),0)/peerQuiz.length) : null;

    const myAvgProgress = myEnrolls.length ? Math.round(myEnrolls.reduce((s,e)=>s+(e.progress||0),0)/myEnrolls.length) : 0;
    const myAvgQuiz      = myQuizAll.length ? Math.round(myQuizAll.reduce((s,q)=>s+(q.pct||0),0)/myQuizAll.length) : null;
    const pendingCount   = mySubsAll.filter(s=>s.status==='submitted').length + myQuizAll.filter(q=>q.needs_review).length;

    const courseDetails = myEnrolls.map(e => {
        const c = allCourses.find(c => c.id === e.course_id);
        return `- ${c?.title || e.course_id}: ความคืบหน้า ${e.progress||0}%`;
    }).join('\n');

    const prompt = `คุณเป็น AI ผู้ช่วยอาจารย์วิเคราะห์นักเรียนรายบุคคลบนแพลตฟอร์มเรียนออนไลน์ SkillNest

ข้อมูลนักเรียนคนนี้:
- ลงทะเบียน ${myEnrolls.length} คอร์ส
${courseDetails || '(ไม่มีคอร์ส)'}
- Progress เฉลี่ยของนักเรียนคนนี้: ${myAvgProgress}%
- คะแนน Quiz เฉลี่ยของนักเรียนคนนี้: ${myAvgQuiz !== null ? myAvgQuiz+'%' : 'ยังไม่ได้ทำ Quiz เลย'}
- งานที่ค้างรอตรวจ/รอครูตรวจ: ${pendingCount} รายการ

ข้อมูลเปรียบเทียบกับเพื่อนร่วมคอร์สเดียวกัน (เฉพาะคอร์สที่นักเรียนคนนี้เรียนอยู่ ไม่รวมตัวนักเรียนเอง):
- Progress เฉลี่ยของเพื่อนร่วมคอร์ส: ${classAvgProgress !== null ? classAvgProgress+'%' : 'ไม่มีข้อมูลเปรียบเทียบ (อาจเป็นคนแรกที่ลงคอร์สนี้)'}
- คะแนน Quiz เฉลี่ยของเพื่อนร่วมคอร์ส: ${classAvgQuiz !== null ? classAvgQuiz+'%' : 'ไม่มีข้อมูลเปรียบเทียบ'}

กรุณาวิเคราะห์เป็นภาษาไทย แบ่งเป็น 4 ส่วน:
1. สรุปภาพรวม (นักเรียนคนนี้เรียนเป็นยังไง สม่ำเสมอไหม)
2. เทียบกับเพื่อนร่วมคอร์ส (สูงกว่า/ต่ำกว่า/พอๆ กับค่าเฉลี่ย และต่างกันมากแค่ไหน)
3. ระดับความเสี่ยง (มีความเสี่ยงเรียนไม่ทัน/ไม่ส่งงาน/หลุดจากคอร์สหรือไม่ พร้อมเหตุผลสั้นๆ)
4. คำแนะนำสำหรับอาจารย์ (ควรทำอะไรกับนักเรียนคนนี้ต่อ เช่น ติดตาม/ให้กำลังใจ/ไม่ต้องทำอะไรเพิ่ม)

กระชับ รวมไม่เกิน 8 ประโยค ใช้ภาษาเป็นกันเอง ตรงไปตรงมา ไม่ต้องชมเกินจริงถ้าข้อมูลไม่ได้ดี
ห้ามใช้ markdown เด็ดขาด (ห้ามใส่ ** หรือ # หรือสัญลักษณ์จัดรูปแบบใดๆ) ให้เป็นข้อความธรรมดาล้วนๆ`;

    try {
        const res = await fetch('/api/groq-analyze', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        const text = data.text || '';
        if (!text) throw new Error('AI ไม่ตอบกลับ');

        const lines = text.split('\n').filter(l => l.trim());
        let html = '<div style="line-height:1.8;font-size:0.87rem;">';
        lines.forEach(line => {
            const t = line.trim().replace(/\*\*/g, '').replace(/^#+\s*/, '').replace(/__/g, '');
            if (t.match(/^[1-9]\.|สรุปภาพรวม|เทียบกับเพื่อน|ระดับความเสี่ยง|คำแนะนำ/)) {
                html += `<div style="color:var(--ta-accent-text);font-weight:600;margin-top:0.7rem;margin-bottom:0.2rem;">${snEscapeHtml(t)}</div>`;
            } else if (t.startsWith('-') || t.startsWith('•')) {
                html += `<div style="padding-left:1rem;">→ ${snEscapeHtml(t.replace(/^[-•]\s*/, ''))}</div>`;
            } else if (t) {
                html += `<div>${snEscapeHtml(t)}</div>`;
            }
        });
        html += `<div style="margin-top:0.8rem;">
            <button type="button" onclick="analyzeStudentWithAI(${snEscapeHtml(JSON.stringify(userId))})"
                style="background:transparent;border:1px solid var(--ta-accent-line);color:var(--ta-accent-text);
                min-height:40px;padding:0 0.9rem;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:0.85rem;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></span> วิเคราะห์ใหม่</button>
        </div></div>`;
        box.innerHTML = html;
    } catch (e) {
        console.error('analyzeStudentWithAI error:', e);
        box.innerHTML = `<div style="color:var(--text-dim);">วิเคราะห์ไม่สำเร็จในขณะนี้
            <button type="button" onclick="analyzeStudentWithAI(${snEscapeHtml(JSON.stringify(userId))})" style="background:none;border:none;color:var(--ta-accent-text);cursor:pointer;text-decoration:underline;">ลองใหม่</button></div>`;
    }
};

window.closeStudentDetail = function() {
    document.getElementById('sdModalOverlay').classList.remove('open');
};

// ให้อาจารย์รีเซ็ต Quiz ส่วนใดส่วนหนึ่ง (บทเดียว หรือทั้งคอร์ส) ของนักเรียนคนหนึ่ง เพื่อให้ทำใหม่ได้
// ใช้ RPC (SECURITY DEFINER) แทนการ update ตรงๆ เพราะแถวนี้เป็นของนักเรียน ไม่ใช่ของอาจารย์เอง
// RLS ปกติมักอนุญาตให้เจ้าของแถวแก้ไขได้เท่านั้น — ฟังก์ชันฝั่ง server จะเช็คสิทธิ์ความเป็นเจ้าของคอร์สแทน
window.resetQuizScope = async function(userId, courseId, lessonIndex) {
    const ok = await confirmDialog('ต้องการรีเซ็ต Quiz ส่วนนี้ให้นักเรียนทำใหม่ได้หรือไม่?\nคำตอบเดิมของส่วนนี้จะถูกลบออก (ส่วนอื่นที่ทำไปแล้วไม่กระทบ)', {
        title: 'ยืนยันการรีเซ็ต Quiz',
        confirmText: 'รีเซ็ต',
        danger: true
    });
    if (!ok) return;
    try {
        const { error } = await supabase.rpc('reset_quiz_scope', {
            p_user_id: userId,
            p_course_id: courseId,
            p_lesson_index: lessonIndex
        });
        if (error) throw error;

        // ดึงแถวล่าสุดจาก DB มาอัปเดตแคชในหน้านี้ แล้ว re-render ให้เห็นผลทันที
        const { data: freshRow } = await supabase.from('quiz_scores')
            .select('*').eq('user_id', userId).eq('course_id', courseId).maybeSingle();
        if (freshRow) {
            const idx = allQuiz.findIndex(q => q.user_id === userId && q.course_id === courseId);
            if (idx >= 0) allQuiz[idx] = freshRow;
        }
        openStudentDetail(userId);
        updateAll();
        toast('รีเซ็ต Quiz สำเร็จ', 'success');
    } catch(e) {
        toast('เกิดข้อผิดพลาด: ' + e.message, 'error');
    }
};

async function renderEvalCard() {
    const card = document.getElementById('evalCard');
    const el = document.getElementById('evalContent');
    if (!card || !el) return;

    if (selectedId === 'all') { card.style.display = 'none'; return; }

    const course = allCourses.find(c => c.id === selectedId);
    if (!course) { card.style.display = 'none'; return; }

    card.style.display = 'block';
    el.innerHTML = '<div class="sn-skeleton-card"><div class="sn-skeleton-line w-60"></div><div class="sn-skeleton-line w-40"></div></div>';

    let evals = [];
    try {
        const { data } = await supabase.from('course_evaluations').select('*').eq('course_id', selectedId);
        evals = data || [];
    } catch (e) {
        el.innerHTML = '<div style="color:var(--text-dim);padding:1rem 0;">โหลดผลประเมินไม่สำเร็จ</div>';
        return;
    }

        return;
    }

    const avg = arr => arr.length ? (arr.reduce((s,v)=>s+v,0)/arr.length).toFixed(1) : '-';
    const teacherAvg = avg(evals.map(e => e.teacher_rating).filter(Boolean));
    const courseAvg  = avg(evals.map(e => e.course_rating).filter(Boolean));

    let html = `<div class="sd-summary-grid" style="margin-bottom:1.25rem;">
        <div class="sd-summary-card"><div class="sd-summary-label">จำนวนคนที่ประเมิน</div><div class="sd-summary-value">${evals.length}</div></div>
        <div class="sd-summary-card"><div class="sd-summary-label">คะแนนอาจารย์เฉลี่ย</div><div class="sd-summary-value"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span> ${teacherAvg}</div></div>
        <div class="sd-summary-card"><div class="sd-summary-label">คะแนนคอร์สเฉลี่ย</div><div class="sd-summary-value"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span> ${courseAvg}</div></div>
    </div>`;

    // เฉลี่ยรายข้อ CLO
    const clos = course.clo || [];
    if (clos.length > 0) {
        html += `<div style="font-weight:600;font-size:0.9rem;margin-bottom:0.6rem;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg></span> คะแนนเฉลี่ยแต่ละ CLO</div>`;
        html += clos.map(c => {
            const key = c.id || c.statement;
            const ratings = evals.map(e => e.clo_ratings?.[key]).filter(v => v != null);
            const cloAvg = avg(ratings);
            return `<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border-color);font-size:0.85rem;">
                <span>${c.id ? `<strong>${snEscapeHtml(c.id)}:</strong> ` : ''}${snEscapeHtml(c.statement || '')}</span>
                <span style="white-space:nowrap;color:${cloAvg!=='-'&&cloAvg<3?'var(--ta-danger-text)':'var(--ta-success-text)'};font-weight:600;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span> ${cloAvg}</span>

        html += teacherComments.map(c => `<div style="padding:8px 10px;background:var(--card-hover);border-radius:var(--radius-sm);margin-bottom:6px;font-size:0.85rem;">"${snEscapeHtml(c)}"</div>`).join('');

        html += courseComments.map(c => `<div style="padding:8px 10px;background:var(--card-hover);border-radius:var(--radius-sm);margin-bottom:6px;font-size:0.85rem;">"${snEscapeHtml(c)}"</div>`).join('');
    }

    el.innerHTML = html;
}

function renderQuizQuestionBreakdown(quiz, courses) {
    const card = document.getElementById('qBreakdownCard');
    const el = document.getElementById('quizQuestionBreakdown');
    if (selectedId === 'all' || courses.length !== 1 || !courses[0].quiz || !courses[0].quiz.length || !quiz.length) {
        card.style.display = 'none';
        return;
    }
    card.style.display = 'block';
    const course = courses[0];
    const labels = ['A','B','C','D'];

    el.innerHTML = course.quiz.map((q, qi) => {
        const qType = q.type || 'multiple_choice';
        // จับคู่คำตอบด้วยข้อความคำถาม แทนตำแหน่ง index — เพราะตอนนี้คำตอบถูกรวมเข้ามาทีละบท ไม่เรียงตามลำดับ course.quiz เสมอไป
        const relevantAnswers = quiz
            .map(qs => (qs.answers || []).find(a => a.question === q.question))
            .filter(Boolean);
        const lessonLabel = q.lessonIndex != null
            ? (course.lessons?.[q.lessonIndex]?.title ? `บทที่ ${q.lessonIndex+1}: ${snEscapeHtml(course.lessons[q.lessonIndex].title)}` : `บทที่ ${q.lessonIndex+1}`)
            : '<span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a6 6 0 00-6 6c0 4 6 12 6 12s6-8 6-12a6 6 0 00-6-6z"/><circle cx="12" cy="8" r="2"/></svg></span> ทั้งคอร์ส';

        if (qType === 'short_answer') {
            const reviewedCount = relevantAnswers.filter(a => !a.needsReview).length;
            return `<div class="qbreak-item">
                <div class="qbreak-q">${qi+1}. ${snEscapeHtml(q.question)} <span style="color:var(--text-dim);font-weight:400;font-size:0.8rem;">(ตอบสั้น/เรียงความ)</span></div>
                ${safeHttpsUrl(q.imageUrl) ? `<img alt="รูปประกอบ" src="${safeHttpsUrl(q.imageUrl)}" style="max-width:200px;max-height:130px;border-radius:var(--radius-sm);display:block;margin:4px 0;">` : ''}
                <div style="font-size:0.85rem;color:var(--ta-accent-text);margin-bottom:4px;">${lessonLabel}</div>
                <div style="font-size:0.85rem;color:var(--text-dim);">ตรวจแล้ว ${reviewedCount}/${relevantAnswers.length} คน</div>
            </div>`;
        }

        const choiceCount = (q.choices || (qType==='true_false' ? ['ถูก','ผิด'] : [])).map((c, ci) => {
            const letter = labels[ci];
            let count = 0;
            relevantAnswers.forEach(a => {
                if (qType === 'checkbox') { if ((a.selectedMultiple||[]).includes(letter)) count++; }
                else { if (a.selected === letter) count++; }
            });
            return { letter, text: c, count };
        });
        const totalAnswered = relevantAnswers.length || 1;
        const correctCount = relevantAnswers.filter(a => a.isCorrect).length;
        const correctPct = Math.round((correctCount/totalAnswered)*100);

        return `<div class="qbreak-item">
            <div class="qbreak-q">${qi+1}. ${snEscapeHtml(q.question)} <span style="color:${correctPct>=60?'var(--ta-success-text)':'var(--ta-warn-text)'};font-weight:600;font-size:0.85rem;">(ถูก ${correctPct}%)</span></div>
            ${safeHttpsUrl(q.imageUrl) ? `<img alt="รูปประกอบ" src="${safeHttpsUrl(q.imageUrl)}" style="max-width:200px;max-height:130px;border-radius:var(--radius-sm);display:block;margin:4px 0;">` : ''}
            <div style="font-size:0.85rem;color:var(--ta-accent-text);margin-bottom:4px;">${lessonLabel}</div>
            ${choiceCount.map(c => {
                const pct = Math.round((c.count/totalAnswered)*100);
                const isCorrectChoice = qType==='checkbox' ? (q.correctMultiple||[]).includes(c.letter) : q.correct === c.letter;
                return `<div class="qbreak-choice-row">
                    <span class="qbreak-choice-label">${c.letter}</span>
                    <div class="qbreak-bar-track"><div class="qbreak-bar-fill${isCorrectChoice?' correct-fill':''}" style="width:${pct}%"></div></div>
                    <span class="qbreak-pct">${pct}%</span>
                </div>`;
            }).join('')}
        </div>`;
    }).join('');
}

// ── Quiz Summary ──
function renderQuizSummary(quiz, courses) {
    const el = document.getElementById('quizSummary');
    if (!courses.length) { el.innerHTML = '<div style="color:var(--text-dim);">ไม่มีข้อมูล</div>'; return; }

    const rows = courses.map(c => {
        const cq  = quiz.filter(q=>q.course_id===c.id);
        const avg = cq.length ? Math.round(cq.reduce((s,q)=>s+(q.pct||0),0)/cq.length) : null;
        const cls = avg===null?'badge-yellow':avg>=75?'badge-green':avg>=40?'badge-yellow':'badge-red';
        const label = avg===null?'ยังไม่มีข้อมูล':avg>=75?`ดีมาก (${avg}%)`:avg>=40?`ควรทบทวน (${avg}%)`:`ต้องพัฒนา (${avg}%)`;
        const title = c.title.length>18 ? c.title.slice(0,18)+'…' : c.title;
        return `<div class="skill-row"><span>${snEscapeHtml(title)}</span><span class="skill-badge ${cls}">${label}</span></div>`;
    }).join('');
    el.innerHTML = rows;
}

// ── Bar Chart ──
function renderBarChart(enrolls, courses) {
    const ctx = document.getElementById('barChart');
    if (!ctx) return;
    if (barChart) barChart.destroy();

    const labels = courses.map(c => c.title.length>14?c.title.slice(0,14)+'…':c.title);
    const progData = courses.map(c => {
        const ce = enrolls.filter(e=>e.course_id===c.id);
        return ce.length ? Math.round(ce.reduce((s,e)=>s+(e.progress||0),0)/ce.length) : 0;
    });
    const watchData = courses.map(c => {
        const ce = enrolls.filter(e=>e.course_id===c.id);
        const totalSec = ce.reduce((s,e)=>s+(e.watch_seconds||0),0);
        return ce.length ? Math.round(totalSec/60/ce.length) : 0;
    });

    barChart = new Chart(ctx, {
        type:'bar',
        data:{
            labels,
            datasets:[
                { label:'Progress เฉลี่ย (%)', data:progData, backgroundColor:themeVar('--primary-blue','#6366F1'), borderRadius:4, yAxisID:'y' },
                { label:'เวลาเรียนเฉลี่ย (นาที)', data:watchData, backgroundColor:themeVar('--primary-blue','#6366F1') + '59', borderColor:themeVar('--primary-blue','#6366F1'), borderWidth:1.5, borderRadius:4, yAxisID:'y1' }
            ]
        },
        options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ labels:{ color:themeVar('--text-dim','#a0a0ba'), font:{ size:11 } } } },
            scales:{
                x:{ grid:{ display:false }, ticks:{ color:themeVar('--text-dim','#a0a0ba'), font:{ size:11 } } },
                y:{ position:'left', max:100, grid:{ color:themeVar('--line','rgba(255,255,255,0.05)') }, ticks:{ color:themeVar('--text-dim','#a0a0ba'), callback:v=>v+'%' } },
                y1:{ position:'right', grid:{ display:false }, ticks:{ color:themeVar('--text-dim','#a0a0ba'), callback:v=>v+' นาที' } }
            }
        }
    });
}

// ── AI Analysis ──
window.runAI = async function() {
    const { enrolls, subs, quiz, courses } = filtered();
    const el = document.getElementById('aiContent');
    if (!el) return;
    el.innerHTML = '<div class="ai-spinner"><div class="spinner-sm"></div><span>Groq LLaMA กำลังวิเคราะห์...</span></div>';

    const done    = enrolls.filter(e=>(e.progress||0)>=100).length;
    const avgProg = enrolls.length ? Math.round(enrolls.reduce((s,e)=>s+(e.progress||0),0)/enrolls.length) : 0;
    const avgQuiz = quiz.length ? Math.round(quiz.reduce((s,q)=>s+(q.pct||0),0)/quiz.length) : 0;
    const pending = subs.filter(s=>s.status==='submitted').length;

    const details = courses.map(c => {
        const ce = enrolls.filter(e=>e.course_id===c.id);
        const cq = quiz.filter(q=>q.course_id===c.id);
        return `"${c.title}": นักเรียน ${ce.length} คน, progress เฉลี่ย ${ce.length?Math.round(ce.reduce((s,e)=>s+(e.progress||0),0)/ce.length):0}%, quiz เฉลี่ย ${cq.length?Math.round(cq.reduce((s,q)=>s+(q.pct||0),0)/cq.length):0}%`;
    }).join('\n');

    const prompt = `คุณเป็น AI ช่วยวิเคราะห์ผลการสอนสำหรับครูบน SkillNest

ข้อมูลคอร์ส:
${details || 'ไม่มีข้อมูล'}

ภาพรวม: นักเรียน ${enrolls.length} คน | เรียนจบ ${done} คน | Progress เฉลี่ย ${avgProg}% | Quiz เฉลี่ย ${avgQuiz}% | การบ้านรอตรวจ ${pending} งาน

วิเคราะห์เป็นภาษาไทย แบ่งเป็น 3 ส่วน:
1. จุดแข็งของการสอน
2. จุดที่ควรปรับปรุง
3. คำแนะนำเชิงรุกสำหรับครั้งถัดไป

กระชับ ไม่เกิน 6-7 ประโยค ใช้ภาษาเป็นกันเอง
ห้ามใช้ markdown เด็ดขาด (ห้ามใส่ ** หรือ # หรือสัญลักษณ์จัดรูปแบบใดๆ) ให้เป็นข้อความธรรมดาล้วนๆ`;

    try {
        const res = await fetch('/api/groq-analyze', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ prompt })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        const text = data.text || '';
        if (!text) throw new Error('AI ตอบกลับว่างเปล่า');

        const lines = text.split('\n').filter(l=>l.trim());
        let html = '';
        lines.forEach(line => {
            // ตัด markdown ที่หลุดมา (**, #, __) เผื่อ AI ไม่ทำตามคำสั่งเป๊ะทุกครั้ง
            const t = line.trim().replace(/\*\*/g, '').replace(/^#+\s*/, '').replace(/__/g, '');
            if (t.match(/^[1-9]\.|จุดแข็ง|จุดที่ควร|คำแนะนำ/)) {
                html += `<div class="ai-section-head">${snEscapeHtml(t)}</div>`;
            } else if (t.startsWith('-') || t.startsWith('•')) {
                html += `<div style="padding-left:1rem;margin-bottom:2px;">→ ${snEscapeHtml(t.replace(/^[-•]\s*/,''))}</div>`;
            } else if (t) {
                html += `<div style="margin-bottom:4px;">${snEscapeHtml(t)}</div>`;
            }
        });
        el.innerHTML = html;
    } catch(e) {
        console.error('AI analyze failed:', e);
        el.innerHTML = `<span style="color:var(--text-dim);">วิเคราะห์ไม่ได้ในขณะนี้ <span style="font-size:var(--text-xs);opacity:.8;">(${snEscapeHtml(e.message)})</span> <button onclick="runAI()" style="background:none;border:none;color:var(--ta-accent-text);cursor:pointer;text-decoration:underline;">ลองใหม่</button></span>`;
    }
};
