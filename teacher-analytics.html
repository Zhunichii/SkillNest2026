<!-- ════ การเข้าถึง (keyboard / โปรแกรมอ่านหน้าจอ) — สคริปต์แยก ไม่แตะ logic ของหน้า ════ -->
<script>
(function () {
    'use strict';
    var doc = document;
    if (!doc.body) return;
    var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
    function visible(el) { return !!(el && el.isConnected && (el.offsetWidth || el.offsetHeight || el.getClientRects().length)); }

    // ---------- ตัวกรองคอร์ส: aria-pressed ตาม class "active" ที่ selectCourse() ตั้งอยู่แล้ว ----------
    function syncTabs() {
        var tabs = doc.querySelectorAll('#courseFilter .filter-tab');
        for (var i = 0; i < tabs.length; i++) {
            var on = tabs[i].classList.contains('active') ? 'true' : 'false';
            if (tabs[i].getAttribute('aria-pressed') !== on) tabs[i].setAttribute('aria-pressed', on);
        }
    }

    // ---------- ไอคอนตกแต่ง ----------
    function hideIcons() {
        var icons = doc.querySelectorAll('.sidebar .sn-icon:not([aria-hidden]), .main-content .sn-icon:not([aria-hidden]), .sd-modal .sn-icon:not([aria-hidden]), .main-content .sn-empty-icon:not([aria-hidden]), .sd-avatar:not([aria-hidden])');
        for (var i = 0; i < icons.length; i++) icons[i].setAttribute('aria-hidden', 'true');
    }

    // ---------- กราฟ: ตารางค่าที่ซ่อนไว้ อ่านจากกราฟที่วาดอยู่ (ข้อความ = ป้ายเดิมของกราฟ) ----------
    var last = {};
    function syncChart(canvasId, tableId) {
        var canvas = doc.getElementById(canvasId), table = doc.getElementById(tableId);
        if (!canvas || !table || !window.Chart || !Chart.getChart) return;
        var ch = Chart.getChart(canvas);
        if (!ch || !ch.data || !ch.data.datasets) return;
        var labels = ch.data.labels || [], sets = ch.data.datasets;
        var key = JSON.stringify([labels, sets.map(function (d) { return [d.label, d.data]; })]);
        if (last[tableId] === key) return;
        last[tableId] = key;
        table.textContent = '';
        var head = null;
        if (sets.length > 1 || sets[0].label) {
            head = doc.createElement('thead');
            var hr = doc.createElement('tr');
            hr.appendChild(doc.createElement('td'));
            sets.forEach(function (d) { var th = doc.createElement('th'); th.scope = 'col'; th.textContent = d.label || ''; hr.appendChild(th); });
            head.appendChild(hr); table.appendChild(head);
        }
        var body = doc.createElement('tbody');
        labels.forEach(function (lab, i) {
            var tr = doc.createElement('tr'), th = doc.createElement('th');
            th.scope = 'row'; th.textContent = lab; tr.appendChild(th);
            sets.forEach(function (d) { var td = doc.createElement('td'); td.textContent = String(d.data[i]); tr.appendChild(td); });
            body.appendChild(tr);
        });
        table.appendChild(body);
    }

    // ---------- หน้าต่างรายละเอียดนักเรียน: โฟกัสเข้า / Tab วน / คืนโฟกัส ----------
    var overlay = doc.getElementById('sdModalOverlay');
    var wasOpen = false, openerSel = null, opener = null;
    function confirmOpen() { return !!doc.querySelector('.sn-confirm-overlay'); }
    function closeBtn() { return overlay && overlay.querySelector('.sd-close-btn'); }
    function syncModal() {
        if (!overlay) return;
        var open = overlay.classList.contains('open');
        if (open && !wasOpen) {
            opener = doc.activeElement;
            openerSel = opener && opener.getAttribute ? opener.getAttribute('onclick') : null;
            var b = closeBtn(); if (b) b.focus();
        } else if (!open && wasOpen) {
            var back = opener && opener.isConnected ? opener : null;
            if (!back && openerSel) {
                var all = doc.querySelectorAll('#studentScoreTable [onclick]');
                for (var i = 0; i < all.length; i++) if (all[i].getAttribute('onclick') === openerSel && all[i].tagName === 'BUTTON') { back = all[i]; break; }
            }
            if (back && visible(back)) back.focus();
            opener = null; openerSel = null;
        } else if (open && !confirmOpen() && !overlay.contains(doc.activeElement)) {
            // เนื้อหาในหน้าต่างถูกสร้างใหม่ (เช่น หลังรีเซ็ต Quiz) หรือกล่องยืนยันเพิ่งปิด → โฟกัสกลับเข้าหน้าต่าง
            var c = closeBtn(); if (c) c.focus();
        }
        wasOpen = open;
    }
    doc.addEventListener('keydown', function (e) {
        // Esc ตอนกล่องยืนยัน (confirmDialog) เปิดอยู่: ปิดแค่กล่องยืนยัน (= กด "ยกเลิก") ไม่ปิดหน้าต่างนักเรียนข้างหลัง
        if (e.key === 'Escape' && confirmOpen()) {
            var cancel = doc.querySelector('.sn-confirm-overlay .sn-confirm-cancel');
            if (cancel) { e.preventDefault(); e.stopImmediatePropagation(); cancel.click(); }
            return;
        }
        if (e.key !== 'Tab' || !overlay || !overlay.classList.contains('open') || confirmOpen()) return;
        var box = overlay.querySelector('.sd-modal');
        var list = Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE), visible);
        if (!list.length) return;
        var first = list[0], lastEl = list[list.length - 1], a = doc.activeElement;
        if (!box.contains(a)) { e.preventDefault(); (e.shiftKey ? lastEl : first).focus(); }
        else if (e.shiftKey && a === first) { e.preventDefault(); lastEl.focus(); }
        else if (!e.shiftKey && a === lastEl) { e.preventDefault(); first.focus(); }
    }, true);

    function syncAll() { syncTabs(); hideIcons(); syncChart('pieChart', 'pieChartTable'); syncChart('barChart', 'barChartTable'); syncModal(); }
    var queued = false;
    function queue() { if (queued) return; queued = true; setTimeout(function () { queued = false; syncAll(); }, 0); }
    new MutationObserver(queue).observe(doc.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style', 'width', 'height'] });
    doc.addEventListener('click', function (e) { if (e.target && e.target.closest && e.target.closest('.filter-tab')) setTimeout(syncAll, 50); });
    syncAll();
})();
</script>
