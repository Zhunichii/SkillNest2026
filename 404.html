<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่พบหน้านี้ — SkillNest</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Anuphan:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        h1, .logo { font-family: var(--font-display); }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .wrap {
            text-align: center;
            max-width: 480px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            margin-bottom: var(--space-10);
        }
        .logo-icon {
            background: var(--primary-blue);
            color: #fff;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .error-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto var(--space-6);
            border-radius: var(--radius-full);
            background: rgba(99,102,241,0.12);
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-icon svg { width: 44px; height: 44px; }

        .error-code {
            font-family: var(--font-display);
            font-size: var(--text-3xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
        }
        .error-title {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--space-3);
        }
        .error-desc {
            color: var(--text-dim);
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
            margin-bottom: var(--space-8);
        }

        .actions {
            display: flex;
            gap: var(--space-3);
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 22px;
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: filter 0.15s ease, background 0.15s ease;
        }
        .btn-primary { background: var(--primary-blue); color: #fff; }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-ghost { background: var(--card-bg); border-color: var(--line); color: var(--text-main); }
        .btn-ghost:hover { background: var(--card-hover); }

        @media (max-width: 480px) {
            .actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .error-icon { animation: floatIcon 3s ease-in-out infinite; }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="dashboard.html" class="logo"><span class="logo-icon">S</span> SkillNest</a>

        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>
        </div>

        <div class="error-code">404</div>
        <div class="error-title">ไม่พบหน้านี้</div>
        <p class="error-desc">หน้าที่คุณกำลังมองหาอาจถูกย้าย ลบไปแล้ว หรือลิงก์ที่ใช้ไม่ถูกต้อง ลองกลับไปหน้าหลักหรือค้นหาคอร์สที่ต้องการอีกครั้ง</p>

        <div class="actions">
            <a href="dashboard.html" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
                กลับหน้าหลัก
            </a>
            <a href="javascript:history.back()" class="btn btn-ghost">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                ย้อนกลับ
            </a>
        </div>
    </div>
    <script src="theme-switcher.js"></script>
</body>
</html>
