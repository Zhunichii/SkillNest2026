<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การบ้าน - SkillNest</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Anuphan:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="ui-feedback.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }

        /* โทเคนเฉพาะหน้านี้ — คำนวณจากสีธีม ใช้ได้ทั้งธีมมืดและสว่าง */
        :root {
            --hw-accent-text: color-mix(in srgb, var(--primary-blue) 72%, var(--text-main));
            --hw-accent-line: color-mix(in srgb, var(--primary-blue) 35%, transparent);
            --hw-success-text: color-mix(in srgb, var(--success) 65%, var(--text-main));
            --hw-success-bg: color-mix(in srgb, var(--success) 12%, transparent);
            --hw-glow: color-mix(in srgb, var(--primary-blue) 20%, transparent);
        }
        :root[data-theme="light"] {
            --hw-glow: color-mix(in srgb, var(--primary-blue) 10%, transparent);
        }

        body {
            color: var(--text-main);
            min-height: 100vh;
            background: var(--bg-color);
        }

        /* Top Nav */
        .top-nav {
            position: fixed; top:0; left:0; right:0; height:70px;
            background: var(--nav-bg); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; padding: 0 30px; gap: 16px; z-index:1000;
        }
        .logo { font-weight:700; font-size:1.2rem; text-decoration:none; color:var(--text-main); }
        .logo span { color: var(--primary-blue); }
        .nav-title { color: var(--text-dim); font-size:0.95rem; }

        /* Layout */
        .app-container { display:flex; min-height:100vh; }
        .sidebar {
            position:fixed; left:0; top:70px; width:250px;
            height:calc(100vh - 70px);
            background: var(--nav-bg); backdrop-filter:blur(15px);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
        }
        .sidebar-item {
            display:flex; align-items:center; gap:12px;
            padding:12px 15px; color:var(--text-dim); text-decoration:none;
            border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer;
            transition: background-color .15s ease, color .15s ease;
        }
        a.sidebar-item, a.sidebar-item:visited { color:var(--text-dim); text-decoration:none; }
        .sidebar-item:hover, a.sidebar-item.active {
            background: var(--active-lesson); color:var(--text-main);
        }
        .main-content {
            margin-left:250px; margin-top:70px;
            padding: 40px; width:calc(100% - 250px);
        }

        /* หัวหน้า + แสงอินดิโกนิ่ง 1 จุด */
        .page-header { position:relative; isolation:isolate; margin-bottom:2rem; }
        .page-header::before {
            content:''; position:absolute; z-index:-1; pointer-events:none;
            left:-80px; top:-120px; width:min(640px, 100%); height:340px;
            background: radial-gradient(closest-side, var(--hw-glow), transparent);
        }
        .page-header h1 {
            font-size:2rem; font-weight:600; margin-bottom:0.4rem;
            display:flex; align-items:center; gap:0.6rem;
        }
        .page-header h1 .sn-icon { color: var(--primary-blue); }
        .page-header p { color:var(--text-dim); font-size:1rem; }

        /* Course selector */
        .course-tabs {
            display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem;
        }
        .course-tab-btn {
            appearance:none; -webkit-appearance:none; margin:0;
            font:inherit; font-size:0.95rem; line-height:1.3; text-align:left;
            min-height:44px; padding:0.6rem 1.1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--line-strong);
            border-radius:var(--radius-full); color:var(--text-dim);
            cursor:pointer; transition: background-color .15s ease, border-color .15s ease, color .15s ease;
        }
        .course-tab-btn:hover { color:var(--text-main); border-color: var(--hw-accent-line); }
        .course-tab-btn.active {
            background: var(--primary-2); border-color: var(--primary-2);
            color:#fff; font-weight:600;
        }

        /* Homework assignment cards */
        .hw-assignment-card {
            background: var(--bg-elevated);
            border: 1px solid var(--line-strong);
            border-radius:var(--radius-xl); margin-bottom:1.5rem; overflow:hidden;
            box-shadow: var(--shadow-md);
        }
        .hw-assignment-header {
            padding:1.25rem 1.5rem;
            border-bottom: 1px solid var(--line);
            display:flex; justify-content:space-between; align-items:center; gap:1rem;
        }
        .hw-assignment-title { font-family:var(--font-display); font-size:1.1rem; font-weight:600; line-height:1.35; }
        .hw-stats { display:flex; gap:0.5rem; flex-wrap:wrap; }
        .hw-stat {
            background: var(--card-bg); border:1px solid var(--line);
            padding:0.3rem 0.8rem; border-radius:var(--radius-full);
            font-size:0.85rem; color:var(--text-dim); white-space:nowrap;
        }
        .hw-stat span { color:var(--text-main); font-weight:600; font-variant-numeric:tabular-nums; }
        .hw-stat:nth-child(2) span { color:var(--hw-accent-text); }
        .hw-stat:nth-child(3) span { color:var(--hw-success-text); }

        /* Submissions table */
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .submissions-table { width:100%; border-collapse:collapse; min-width: 640px; }
        .submissions-table th, .submissions-table td {
            padding:0.9rem 1.25rem; text-align:left; font-size:0.95rem; vertical-align:middle;
        }
        .submissions-table th {
            color:var(--text-dim); border-bottom:1px solid var(--line-strong);
            font-weight:600; font-size:0.85rem;
        }
        .submissions-table td { border-bottom:1px solid var(--line); }
        .submissions-table tr:last-child td { border-bottom:none; }
        .submissions-table tbody tr:hover td { background:var(--card-hover); }
        .submissions-table input[type="checkbox"] { width:18px; height:18px; accent-color: var(--primary-blue); cursor:pointer; vertical-align:middle; }

        /* สถานะ: แยกด้วยข้อความ + ไอคอน + น้ำหนักตัวอักษร + กรอบ ไม่พึ่งสีอย่างเดียว */
        .status-badge {
            display:inline-flex; align-items:center; gap:0.35rem;
            padding:0.25rem 0.7rem; border-radius:var(--radius-full); border:1px solid transparent;
            font-size:0.85rem; line-height:1.4; white-space:nowrap; font-variant-numeric:tabular-nums;
        }
        .status-badge.submitted {
            background: var(--active-lesson); border-color: var(--hw-accent-line);
            color: var(--hw-accent-text); font-weight:600;
        }
        .status-badge.graded {
            background: var(--hw-success-bg); color: var(--hw-success-text); font-weight:500;
        }

        .btn-grade {
            display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;
            min-height:40px; padding:0.5rem 1rem;
            background: var(--primary-2); color:#fff;
            border:1px solid var(--primary-2); border-radius:var(--radius-md);
            font-family:inherit; font-size:0.9rem; font-weight:600; white-space:nowrap;
            cursor:pointer; transition: filter .15s ease, background-color .15s ease;
        }
        .btn-grade:hover { filter: brightness(1.12); }

        .view-link {
            color:var(--hw-accent-text); text-decoration:underline; text-underline-offset:3px; font-size:0.9rem;
        }
        .view-link:hover { text-decoration-thickness:2px; }

        /* แถวที่รอตรวจ: แถบซ้ายอินดิโก + ปุ่มทึบ / แถวที่ตรวจแล้ว: ปุ่ม "แก้คะแนน" เป็นปุ่มรอง
           เบราว์เซอร์ที่ไม่รองรับ :has() จะข้ามกฎชุดนี้ทั้งชุด สถานะยังแยกได้จากป้าย (ข้อความ/ไอคอน/น้ำหนัก) */
        @supports selector(:has(*)) {
            .submissions-table tbody tr:has(.status-badge.submitted) td:first-child {
                box-shadow: inset 3px 0 0 var(--primary-blue);
            }
            .submissions-table tbody tr:has(.status-badge.graded) .btn-grade {
                background: transparent; color: var(--hw-accent-text); border-color: var(--hw-accent-line);
            }
            .submissions-table tbody tr:has(.status-badge.graded) .btn-grade:hover {
                filter:none; background: var(--active-lesson);
            }
        }

        /* Grade Modal */
        .modal-overlay {
            position:fixed; inset:0;
            background: color-mix(in srgb, var(--bg-color) 85%, transparent);
            z-index:3000;
            display:none; align-items:center; justify-content:center; padding:1rem;
        }
        .modal-overlay.show { display:flex; }
        .grade-modal {
            position:relative;
            background: var(--bg-elevated);
            border:1px solid var(--line-strong);
            border-radius:var(--radius-xl); width:100%; max-width:560px;
            padding:2rem; max-height:90vh; overflow-y:auto;
            box-shadow: var(--shadow-lg);
        }
        .grade-modal h3 {
            font-size:1.25rem; font-weight:600; margin-bottom:1.25rem; padding-right:2.75rem;
            display:flex; align-items:center; gap:0.5rem;
        }
        .grade-modal h3 .sn-icon { color: var(--primary-blue); }
        .hw-modal-close {
            position:absolute; top:1.25rem; right:1.25rem;
            width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center;
            background:transparent; border:1px solid transparent; border-radius:var(--radius-md);
            color:var(--text-dim); font-size:1.25rem; cursor:pointer;
            transition: background-color .15s ease, color .15s ease;
        }
        .hw-modal-close:hover { background:var(--card-hover); color:var(--text-main); border-color:var(--line); }

        /* คะแนนที่ AI เสนอ: พื้นอินดิโกจาง + ขอบซ้ายอินดิโก แยกจากช่องคะแนนที่ครูยืนยัน */
        .ai-grade-note {
            background: var(--active-lesson);
            border:1px solid var(--hw-accent-line);
            border-left:3px solid var(--primary-blue);
            border-radius:var(--radius-md); padding:12px 14px;
            font-size:0.95rem; color:var(--text-main); margin-top:12px; line-height:1.6;
        }
        .ai-grade-note > .sn-icon:first-child { color: var(--hw-accent-text); }
        #btnAiGradeHw:hover:not(:disabled) { border-color: var(--primary-blue); }
        #btnAiGradeHw:disabled { opacity:0.65; cursor:progress; }

        .form-group { margin-bottom:1.25rem; }
        .form-group label { display:block; margin-bottom:0.45rem; font-size:0.95rem; font-weight:500; color:var(--text-main); }
        .form-control {
            width:100%; min-height:48px; padding:0.75rem 1rem;
            background: var(--input-bg); border:1px solid var(--line-strong);
            border-radius:var(--radius-md); color:var(--text-main);
            font-family:inherit; font-size:1rem; line-height:1.5;
        }
        .form-control::placeholder { color:var(--text-faint); }
        .form-control:focus { outline:none; border-color:var(--primary-blue); box-shadow: var(--shadow-focus); }
        textarea.form-control { resize:vertical; min-height:96px; font-family:inherit; }
        .submission-preview {
            background: var(--card-bg); border:1px solid var(--line);
            border-radius:var(--radius-md); padding:1rem; margin-bottom:1.25rem;
            font-size:0.95rem; color:var(--text-dim); line-height:1.65;
            overflow-wrap:anywhere;
        }
        .modal-actions { display:flex; gap:0.75rem; margin-top:1.5rem; }
        .btn-confirm-grade {
            flex:1; min-height:48px; padding:0.75rem 1rem;
            display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
            background: var(--primary-2); border:1px solid var(--primary-2);
            color:#fff; border-radius:var(--radius-md);
            font-family:inherit; font-weight:600; font-size:var(--text-base); cursor:pointer;
            transition: filter .15s ease;
        }
        .btn-confirm-grade:hover { filter: brightness(1.12); }
        .btn-confirm-grade:disabled { opacity:0.65; cursor:progress; filter:none; }
        .btn-cancel-grade {
            min-height:48px; padding:0.75rem 1.5rem;
            background:transparent;
            border:1px solid var(--line-strong);
            color:var(--text-main); border-radius:var(--radius-md); cursor:pointer;
            font-family:inherit; font-size:var(--text-base); font-weight:500;
        }
        .btn-cancel-grade:hover { background:var(--card-hover); }

        /* Empty & Loading */
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-dim); }
        .empty-icon { font-size:3rem; margin-bottom:1rem; color:var(--text-faint); }
        .empty-state h3 { color:var(--text-main); font-weight:600; margin-bottom:0.5rem; }
        .spinner-wrap { display:flex; justify-content:center; padding:60px; }
        .spinner {
            width:40px; height:40px;
            border:3px solid var(--line-strong);
            border-top:3px solid var(--primary-blue);
            border-radius:50%; animation:spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } }

        @media (max-width:768px) {
            .sidebar { width:70px; }
            .sidebar-item span { display:none; }
            .main-content { margin-left:70px; width:calc(100% - 70px); padding:20px; }
        }

        /* ≤720px: ตารางกลายเป็นการ์ดรายคน (CSS ล้วน) — ไม่ต้องเลื่อนแนวนอนในกรอบ
           role="table/row/cell" ใน markup คงความหมายของตารางไว้ให้โปรแกรมอ่านหน้าจอ แม้ display เปลี่ยน */
        @media (max-width:720px) {
            .table-scroll { overflow: visible; }
            .submissions-table, .submissions-table thead, .submissions-table tbody { display:block; min-width:0; }
            .submissions-table tr { display:grid; grid-template-columns: auto minmax(0,1fr) auto; column-gap:0.75rem; row-gap:0.35rem; align-items:center; }
            .submissions-table th, .submissions-table td { display:block; padding:0; border:none; font-size:0.95rem; }
            .submissions-table tbody tr:hover td { background:transparent; }

            /* หัวตาราง: เหลือ "เลือกทั้งหมด" + "นักเรียน" ส่วนหัวคอลัมน์อื่นซ่อนแบบโปรแกรมอ่านหน้าจอยังอ่านได้ */
            .submissions-table thead tr { padding:0.75rem 1rem; border-bottom:1px solid var(--line-strong); }
            .submissions-table th { width:auto !important; }
            .submissions-table th:nth-child(2) { grid-column: 2 / -1; }
            .submissions-table th:nth-child(n+3) {
                position:absolute; width:1px; height:1px; overflow:hidden;
                clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
            }

            .submissions-table tbody tr { padding:1rem; border-bottom:1px solid var(--line); }
            .submissions-table tbody tr:last-child { border-bottom:none; }
            .submissions-table tbody td:nth-child(1) { grid-column:1; grid-row:1; }
            .submissions-table tbody td:nth-child(2) { grid-column:2 / -1; grid-row:1; font-weight:600; overflow-wrap:anywhere; }
            .submissions-table tbody td:nth-child(3) { grid-column:2 / -1; color:var(--text-dim); font-size:0.875rem; }
            .submissions-table tbody td:nth-child(4) { grid-column:2; min-width:0; }
            .submissions-table tbody td:nth-child(5) { grid-column:3; justify-self:end; }
            .submissions-table tbody td:nth-child(6) { grid-column:1 / -1; margin-top:0.5rem; }
            .submissions-table tbody td[colspan] { grid-column:1 / -1; }
            .submissions-table .btn-grade { width:100%; min-height:44px; }

            @supports selector(:has(*)) {
                .submissions-table tbody tr:has(.status-badge.submitted) { box-shadow: inset 3px 0 0 var(--primary-blue); }
                .submissions-table tbody tr:has(.status-badge.submitted) td:first-child { box-shadow:none; }
            }
        }

        @media (max-width:560px) {
            .page-header h1 { font-size:1.6rem; }
            .hw-assignment-header { flex-direction:column; align-items:flex-start; padding:1rem; }
            .hw-stats { flex-wrap:wrap; }
            .course-tabs { gap:0.4rem; }
            .grade-modal { padding:1.25rem; max-height:92vh; }
            .hw-modal-close { top:0.75rem; right:0.75rem; }
            .modal-actions { flex-direction:column-reverse; }
            .btn-cancel-grade { width:100%; }
        }
    </style>
<script src="tour.js"></script>
<script type="module" src="auth-guard.js"></script>
</head>

<!-- Grade Modal -->
<div class="modal-overlay" id="gradeModalOverlay">
    <div class="grade-modal" role="dialog" aria-modal="true" aria-labelledby="gradeModalTitle">
        <h3 id="gradeModalTitle"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4Z"/></svg></span> ให้คะแนนการบ้าน</h3>
        <button type="button" class="hw-modal-close" onclick="closeGradeModal()" aria-label="ปิด"><span class="sn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span></button>
        <div id="gradeStudentInfo" style="color:var(--text-dim); font-size:0.9rem; margin-bottom:1rem;"></div>
        <div class="submission-preview" id="gradeSubmissionPreview"></div>
        <div class="form-group" id="gradeScoreSingleWrap">
            <label for="gradeScore">คะแนน (เต็ม <span id="gradeMaxScore">100</span>)</label>
            <input type="number" class="form-control" id="gradeScore" min="0" placeholder="ใส่คะแนน">
        </div>
        <div class="form-group" id="gradeRubricWrap" style="display:none;">
            <label id="gradeRubricLabel">ให้คะแนนแยกทีละหัวข้อ (Rubric)</label>
            <div id="gradeRubricRows" role="group" aria-labelledby="gradeRubricLabel"></div>
            <div style="text-align:right;font-weight:600;margin-top:0.75rem;font-size:0.95rem;">
                รวม: <span id="gradeRubricTotal">0</span> / <span id="gradeRubricMax">0</span>
            </div>
        </div>
        <div style="margin-bottom:1rem;">
            <button type="button" id="btnAiGradeHw" onclick="aiGradeCurrentSubmission()"
                style="background:var(--active-lesson);border:1px solid var(--hw-accent-line);color:var(--hw-accent-text);
                padding:10px 16px;min-height:44px;border-radius:var(--radius-md);cursor:pointer;font-family:inherit;font-size:0.9rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;">
                <span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg></span> ให้ AI ช่วยตรวจ
            </button>
            <div id="gradeCriteriaHint"></div>
            <div id="aiGradeNote"></div>
        </div>
        <div class="form-group">
            <label for="gradeComment">ความคิดเห็น / Feedback</label>
            <textarea class="form-control" id="gradeComment" placeholder="ให้ feedback กับนักเรียน..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-confirm-grade" onclick="confirmGrade()"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> บันทึกคะแนน</button>
            <button class="btn-cancel-grade" onclick="closeGradeModal()">ยกเลิก</button>
        </div>
    </div>
</div>

<!-- Bulk Grade Modal -->
<div class="modal-overlay" id="bulkGradeModalOverlay">
    <div class="grade-modal" role="dialog" aria-modal="true" aria-labelledby="bulkGradeModalTitle">
        <h3 id="bulkGradeModalTitle"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4Z"/></svg></span> ให้คะแนนพร้อมกันหลายคน</h3>
        <button type="button" class="hw-modal-close" onclick="closeBulkGradeModal()" aria-label="ปิด"><span class="sn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span></button>
        <div id="bulkGradeInfo" style="color:var(--text-dim); font-size:0.9rem; margin-bottom:1rem;"></div>
        <div id="bulkGradeStudentList" style="max-height:120px; overflow-y:auto; background:var(--card-hover);
            border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:1rem; font-size:0.82rem; color:var(--text-dim);"></div>
        <div class="form-group">
            <label for="bulkGradeScore">คะแนน (เต็ม <span id="bulkGradeMaxScore">100</span>) — ให้คะแนนเท่ากันทุกคนที่เลือก</label>
            <input type="number" class="form-control" id="bulkGradeScore" min="0" placeholder="ใส่คะแนน">
        </div>
        <div class="form-group">
            <label for="bulkGradeComment">ความคิดเห็น / Feedback (ใช้ข้อความเดียวกันทุกคน — เว้นว่างได้ถ้าไม่ต้องการ)</label>
            <textarea class="form-control" id="bulkGradeComment" placeholder="ให้ feedback กับนักเรียนทุกคนที่เลือก..."></textarea>
        </div>
        <div class="form-group">
            <small style="display:block;color:var(--text-dim);font-size:0.85rem;line-height:1.55;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></span> เหมาะกับงานที่ตรวจแบบเดียวกันได้ เช่น ทุกคนทำถูกให้เต็ม — ถ้าคะแนนแต่ละคนต่างกัน ควรตรวจทีละคนแทน</small>
        </div>
        <div class="modal-actions">
            <button class="btn-confirm-grade" id="btnConfirmBulkGrade" onclick="confirmBulkGrade()"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> บันทึกคะแนนทั้งหมด</button>
            <button class="btn-cancel-grade" onclick="closeBulkGradeModal()">ยกเลิก</button>
        </div>
    </div>
</div>

<script type="module">
import { supabase } from './supabase.js';

let currentUser = null;
let myCourses = [];
let pendingGrade = null;
let currentCourseId = null;
let _lastLoadedSubmissions = [];
let _lastLoadedStudentNames = {};

// Auth check — teacher only
const { data: { user } } = await supabase.auth.getUser();
if (!user) { window.location.href = '../login-page/login.html'; }

const { data: userDoc } = await supabase.from('users').select('*').eq('id', user.id).single();
if (userDoc && userDoc.user_type !== 'teacher') {
    toast('หน้านี้สำหรับครูเท่านั้น', 'error');
    window.location.href = 'dashboard.html';
}
currentUser = user;
await loadMyCourses();

async function loadMyCourses() {
    const tabsEl = document.getElementById('courseTabs');
    try {
        const { data: courses, error } = await supabase
            .from('courses')
            .select('*')
            .eq('creator_id', currentUser.id);

        if (error) throw error;

        myCourses = (courses || []).filter(c => c.homework && c.homework.length > 0);

        if (myCourses.length === 0) {
            tabsEl.innerHTML = '';
            document.getElementById('hwContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6"/><path d="M22 12l-10 5L2 12"/><path d="M2 12l5.45-6.32A2 2 0 018.96 5h6.08a2 2 0 011.51.68L22 12"/></svg></span></div>
                    <h3>ยังไม่มีคอร์สที่มีการบ้าน</h3>
                    <p>ไปที่ "เพิ่มคอร์ส" เพื่อสร้างการบ้านในคอร์สของคุณ</p>
                </div>`;
            return;
        }

        tabsEl.innerHTML = myCourses.map((c, i) =>
            `<button type="button" class="course-tab-btn ${i===0?'active':''}" onclick="selectCourse('${c.id}', this)">${snEscapeHtml(c.title)}</button>`
        ).join('');

        await loadHomeworksByCourse(myCourses[0].id);

    } catch(e) {
        console.error(e);
        tabsEl.innerHTML = `<p style="color:var(--text-dim);">เกิดข้อผิดพลาด: ${snEscapeHtml(e.message)}</p>`;
    }
}

window.selectCourse = async function(courseId, btn) {
    document.querySelectorAll('.course-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    await loadHomeworksByCourse(courseId);
};

async function loadHomeworksByCourse(courseId) {
    currentCourseId = courseId;
    const contentEl = document.getElementById('hwContent');
    const exportBtn = document.getElementById('btnExportCsv');
    contentEl.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
    if (exportBtn) exportBtn.style.display = 'none';

    const course = myCourses.find(c => c.id === courseId);
    if (!course || !course.homework) { contentEl.innerHTML = ''; return; }

    // โหลด submissions ของคอร์สนี้
    let submissions = [];
    try {
        const { data } = await supabase
            .from('submissions')
            .select('*')
            .eq('course_id', courseId);
        submissions = data || [];
    } catch(e) {}

    // โหลดชื่อนักเรียน
    const studentNames = {};
    const userIds = [...new Set(submissions.map(s => s.user_id))];
    for (const uid of userIds) {
        try {
            const { data: u } = await supabase.from('users').select('first_name, last_name, email').eq('id', uid).single();
            if (u) studentNames[uid] = `${u.first_name||''} ${u.last_name||''}`.trim() || u.email;
        } catch(e) {}
    }

    // เก็บไว้ใช้ตอน export CSV (กันไม่ต้องดึงข้อมูลซ้ำ)
    _lastLoadedSubmissions  = submissions;
    _lastLoadedStudentNames = studentNames;
    if (exportBtn) exportBtn.style.display = userIds.length > 0 ? 'inline-flex' : 'none';

    contentEl.innerHTML = '';

    course.homework.forEach((hw, idx) => {
        const hwSubs = submissions.filter(s => s.homework_index === idx);
        const gradedCount  = hwSubs.filter(s => s.status === 'graded').length;
        const pendingCount = hwSubs.filter(s => s.status === 'submitted').length;
        const deadlineText = hw.deadline ? new Date(hw.deadline).toLocaleString('th-TH') : 'ไม่มีกำหนด';

        let rowsHtml = '';
        if (hwSubs.length === 0) {
            rowsHtml = `<tr role="row"><td role="cell" colspan="6" style="text-align:center;color:var(--text-dim);padding:2rem;">ยังไม่มีนักเรียนส่งงาน</td></tr>`;
        } else {
            rowsHtml = hwSubs.map(sub => {
                const name = studentNames[sub.user_id] || sub.user_id;
                const submittedAt = sub.submitted_at
                    ? new Date(sub.submitted_at).toLocaleString('th-TH')
                    : 'ไม่ระบุ';
                const statusBadge = sub.status === 'graded'
                    ? `<span class="status-badge graded"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> ตรวจแล้ว (${sub.grade}/${hw.maxScore||100})</span>`
                    : `<span class="status-badge submitted"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg></span> รอตรวจ</span>`;
                const workHtml = sub.content
                    ? `<span title="${snEscapeHtml(sub.content.substring(0,200))}" style="cursor:help;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4Z"/></svg></span> ดูงาน</span>` : '';
                const fileHtml = sub.file_url
                    ? `<a href="${sub.file_url}" target="_blank" class="view-link"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95L10.5 17.56a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></span> ไฟล์</a>` : '';

                return `<tr role="row">
                    <td role="cell"><input type="checkbox" class="hw-row-check" data-hwidx="${idx}"
                        value="${sub.id}" data-uid="${sub.user_id}" data-name="${escapeHtml(name)}"
                        aria-labelledby="subName-${sub.id}"
                        onchange="updateBulkBar(${idx})"></td>
                    <td role="cell" id="subName-${sub.id}">${snEscapeHtml(name)}</td>
                    <td role="cell">${submittedAt}</td>
                    <td role="cell">${workHtml} ${fileHtml}</td>
                    <td role="cell">${statusBadge}</td>
                    <td role="cell">
                        <button class="btn-grade" onclick="openGradeModal('${sub.id}','${escapeHtml(sub.content||'')}','${sub.file_url||''}','${escapeHtml(name)}',${hw.maxScore||100},${sub.grade||0},'${escapeHtml(sub.comment||'')}','${sub.user_id}','${courseId}','${escapeHtml(hw.title||'')}','${escapeHtml(hw.description||'')}','${escapeHtml(hw.gradingCriteria||'')}',${idx})">
                            <span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4Z"/></svg></span> ${sub.status==='graded'?'แก้คะแนน':'ให้คะแนน'}
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        const card = document.createElement('div');
        card.className = 'hw-assignment-card';
        card.innerHTML = `
            <div class="hw-assignment-header">
                <div>
                    <div class="hw-assignment-title">${idx+1}. ${snEscapeHtml(hw.title)}</div>
                    <div style="color:var(--text-dim);font-size:0.82rem;margin-top:0.25rem;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span> ${deadlineText} • คะแนนเต็ม ${hw.maxScore||100}</div>
                </div>
                <div class="hw-stats">
                    <div class="hw-stat">ส่งแล้ว <span>${hwSubs.length}</span></div>
                    <div class="hw-stat">รอตรวจ <span>${pendingCount}</span></div>
                    <div class="hw-stat">ตรวจแล้ว <span>${gradedCount}</span></div>
                </div>
            </div>
            <div id="bulkBar-${idx}" style="display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
                background:var(--active-lesson);border:1px solid var(--hw-accent-line);
                border-radius:var(--radius-md);padding:8px 8px 8px 14px;margin:12px 1rem 4px;font-size:0.9rem;">
                <span id="bulkCount-${idx}" style="color:var(--hw-accent-text);font-weight:600;"></span>
                <button onclick="openBulkGradeModal(${idx}, ${hw.maxScore||100}, '${escapeHtml(hw.title||'')}')"
                    style="background:var(--primary-2);border:1px solid var(--primary-2);color:#fff;padding:8px 14px;min-height:40px;
                    border-radius:var(--radius-md);cursor:pointer;font-family:inherit;font-size:0.875rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;">
                    <span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4Z"/></svg></span> ให้คะแนนพร้อมกัน
                </button>
            </div>
            <div class="table-scroll">
            <table class="submissions-table" role="table">
                <thead role="rowgroup"><tr role="row">
                    <th role="columnheader" style="width:36px;"><input type="checkbox" onchange="toggleSelectAll(${idx}, this.checked)" title="เลือกทั้งหมด"></th>
                    <th role="columnheader">นักเรียน</th><th role="columnheader">เวลาส่ง</th><th role="columnheader">งาน</th><th role="columnheader">สถานะ</th><th role="columnheader">ดำเนินการ</th>
                </tr></thead>
                <tbody role="rowgroup">${rowsHtml}</tbody>
            </table>
            </div>`;
        contentEl.appendChild(card);
    });
}

function escapeHtml(str) {
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
}

window.openGradeModal = function(subId, content, fileUrl, studentName, maxScore, currentGrade, currentComment, studentUserId, courseId, hwTitle, hwDescription, hwGradingCriteria, hwIdx) {
    const course = myCourses.find(c => c.id === courseId);
    const hw = course?.homework?.[hwIdx];
    const rubric = Array.isArray(hw?.rubric) && hw.rubric.length > 0 ? hw.rubric : null;
    // ดึงคะแนนแยกหัวข้อเดิม (ถ้าเคยตรวจแบบ rubric ไปแล้วมาก่อน) จากแคชที่โหลดไว้แล้ว กันไม่ต้อง query ซ้ำ
    const sub = _lastLoadedSubmissions.find(s => s.id === subId);
    const existingRubricScores = sub?.rubric_scores || null;

    pendingGrade = { subId, maxScore, studentUserId, courseId, hwTitle, hwDescription, hwGradingCriteria, content, fileUrl, rubric };

    document.getElementById('gradeStudentInfo').textContent = `นักเรียน: ${studentName}`;
    document.getElementById('aiGradeNote').innerHTML = '';
    document.getElementById('gradeCriteriaHint').innerHTML = hwGradingCriteria
        ? `<div style="font-size:0.85rem;color:var(--text-dim);margin-top:8px;line-height:1.5;"><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg></span> เกณฑ์ที่ตั้งไว้: "${hwGradingCriteria}"</div>`
        : '';

    const singleWrap = document.getElementById('gradeScoreSingleWrap');
    const rubricWrap = document.getElementById('gradeRubricWrap');

    if (rubric) {
        singleWrap.style.display = 'none';
        rubricWrap.style.display = 'block';
        document.getElementById('gradeRubricRows').innerHTML = rubric.map((r, i) => {
            const existingScore = existingRubricScores?.[i]?.score;
            return `<div class="grade-rubric-row" style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:8px 0;border-bottom:1px solid var(--line);">
                <label for="gradeRubricScore-${i}" style="font-size:0.95rem;flex:1;margin:0;color:var(--text-main);">${r.criterion}</label>
                <input type="number" class="grade-rubric-score" id="gradeRubricScore-${i}" min="0" max="${r.points}" value="${existingScore ?? ''}" style="width:5.5rem;min-height:48px;padding:8px 10px;font-family:inherit;font-size:1rem;color:var(--text-main);background:var(--input-bg);border:1px solid var(--line-strong);border-radius:var(--radius-md);" oninput="updateGradeRubricTotal()">
                <span style="font-size:0.85rem;color:var(--text-dim);white-space:nowrap;">/ ${r.points}</span>
            </div>`;
        }).join('');
        document.getElementById('gradeRubricMax').textContent = maxScore;
        updateGradeRubricTotal();
    } else {
        singleWrap.style.display = 'block';
        rubricWrap.style.display = 'none';
        document.getElementById('gradeMaxScore').textContent = maxScore;
        document.getElementById('gradeScore').max = maxScore;
        document.getElementById('gradeScore').value = currentGrade || '';
    }

    document.getElementById('gradeComment').value = currentComment || '';

    let previewHtml = '';
    if (content) previewHtml += `<div><span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4Z"/></svg></span> งานที่ส่ง:<br><br>${snEscapeHtml(content)}</div>`;
    if (fileUrl) previewHtml += `${content?'<br>':''}<span class="sn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95L10.5 17.56a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></span> ไฟล์แนบ: <a href="${snEscapeHtml(fileUrl)}" target="_blank" style="color:var(--hw-accent-text);">เปิดไฟล์</a>`;
    if (!content && !fileUrl) previewHtml = '<em>ไม่มีเนื้อหางาน</em>';
    document.getElementById('gradeSubmissionPreview').innerHTML = previewHtml;
    document.getElementById('gradeModalOverlay').classList.add('show');
};

window.updateGradeRubricTotal = function() {
    const inputs = document.querySelectorAll('#gradeRubricRows .grade-rubric-score');
    const total = Array.from(inputs).reduce((sum, inp) => sum + (parseFloat(inp.value) || 0), 0);
    const totalEl = document.getElementById('gradeRubricTotal');
    if (totalEl) totalEl.textContent = total;
};

window.closeGradeModal = function() {
    document.getElementById('gradeModalOverlay').classList.remove('show');
    pendingGrade = null;
};

window.confirmGrade = async function() {
    if (!pendingGrade) return;
    const comment = document.getElementById('gradeComment').value.trim();
    let score, rubricScoresToSave = null;

    if (pendingGrade.rubric) {
        const inputs = document.querySelectorAll('#gradeRubricRows .grade-rubric-score');
        rubricScoresToSave = Array.from(inputs).map((inp, i) => {
            const max = pendingGrade.rubric[i].points;
            let s = parseFloat(inp.value);
            if (isNaN(s)) s = 0;
            s = Math.max(0, Math.min(max, s));
            return { criterion: pendingGrade.rubric[i].criterion, points: max, score: s };
        });
        score = rubricScoresToSave.reduce((sum, r) => sum + r.score, 0);
    } else {
        score = parseInt(document.getElementById('gradeScore').value);
        if (isNaN(score) || score < 0 || score > pendingGrade.maxScore) {
            toast(`กรุณาใส่คะแนนระหว่าง 0 - ${pendingGrade.maxScore}`, 'warning'); return;
        }
    }

    try {
        const updatePayload = {
            grade: score,
            comment,
            status: 'graded',
            graded_at: new Date().toISOString()
        };
        if (rubricScoresToSave) updatePayload.rubric_scores = rubricScoresToSave;

        const { error } = await supabase
            .from('submissions')
            .update(updatePayload)
            .eq('id', pendingGrade.subId);

        if (error) throw error;

        // แจ้งเตือนนักเรียนว่าตรวจงานเสร็จแล้ว (ไม่ให้ error ตรงนี้ไปบล็อกการบันทึกคะแนนที่สำเร็จแล้ว)
        try {
            const course = myCourses.find(c => c.id === pendingGrade.courseId);
            await supabase.from('notifications').insert({
                target_user_id: pendingGrade.studentUserId,
                type: 'homework',
                title: 'การบ้านของคุณถูกตรวจแล้ว',
                message: `"${pendingGrade.hwTitle}" ในคอร์ส "${course?.title || ''}" — ได้คะแนน ${score}/${pendingGrade.maxScore}`,
                link: `course-content.html?id=${pendingGrade.courseId}&tab=homework`,
                created_at: new Date().toISOString(),
            });
        } catch(notifErr) {
            console.warn('ส่งแจ้งเตือนไม่สำเร็จ (คะแนนบันทึกแล้วปกติ):', notifErr);
        }

        closeGradeModal();
        const activeTab = document.querySelector('.course-tab-btn.active');
        if (activeTab) activeTab.click();
    } catch(e) {
        toast('เกิดข้อผิดพลาด: ' + e.message, 'error');
    }
};

// ============ AI ช่วยตรวจ ============
// โหลด PDF.js แบบเบา (ดึงแค่ข้อความ ไม่ render รูปหน้า — พอสำหรับ PDF ที่พิมพ์มา
// ถ้าเป็น PDF ที่สแกนเป็นรูป (ไม่มี text layer) จะดึงข้อความไม่ได้ ต้องตรวจเองในกรณีนั้น)
async function ensurePdfJsLoadedLite() {
    if (window.pdfjsLib) return;
    await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

async function fetchFileAsBase64(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('ดึงไฟล์ไม่สำเร็จ');
    const blob = await resp.blob();
    const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
    return { base64, mimeType: blob.type };
}

// พยายามดึง "เนื้อหาที่อ่านได้" จากงานที่ส่งมา ไม่ว่าจะเป็นข้อความ / ไฟล์ PDF / รูปภาพ
async function extractGradingContent(pendingGrade) {
    // มีข้อความอยู่แล้ว (งานแบบพิมพ์ตอบ หรือโค้ด) — ใช้ตรงๆ
    if (pendingGrade.content && pendingGrade.content.trim()) {
        return { answerText: pendingGrade.content, images: null };
    }
    if (!pendingGrade.fileUrl) {
        return { answerText: '', images: null };
    }

    const url = pendingGrade.fileUrl.toLowerCase();
    if (url.includes('.pdf')) {
        await ensurePdfJsLoadedLite();
        const pdf = await window.pdfjsLib.getDocument(pendingGrade.fileUrl).promise;
        let text = '';
        const maxPages = Math.min(pdf.numPages, 15);
        for (let i = 1; i <= maxPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(it => it.str).join(' ') + '\n';
        }
        if (!text.trim()) {
            throw new Error('ไฟล์ PDF นี้ไม่มีข้อความให้อ่าน (อาจเป็นไฟล์สแกน/รูปภาพ) — กรุณาตรวจเองครับ');
        }
        return { answerText: text.slice(0, 6000), images: null };
    }

    if (/\.(jpg|jpeg|png|webp|gif)(\?|$)/.test(url) || url.startsWith('data:image')) {
        const { base64, mimeType } = await fetchFileAsBase64(pendingGrade.fileUrl);
        return { answerText: '', images: [{ data: base64, mimeType }] };
    }

    throw new Error('ไม่รองรับไฟล์ประเภทนี้สำหรับ AI ช่วยตรวจ (รองรับข้อความ, PDF ที่มีตัวอักษร, และรูปภาพ) กรุณาตรวจเองครับ');
}

                    comment,

// ============ EXPORT CSV ============
// ครอบข้อความให้ปลอดภัยสำหรับ CSV (กัน comma/quote/ขึ้นบรรทัดใหม่ในชื่อ/ความเห็นทำให้ format พัง)
function csvCell(val) {
    const s = String(val ?? '');
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
}

window.exportGradesCsv = function() {
    const course = myCourses.find(c => c.id === currentCourseId);
    if (!course || !course.homework) return;

    const submissions   = _lastLoadedSubmissions;
    const studentNames  = _lastLoadedStudentNames;
    const studentIds    = [...new Set(submissions.map(s => s.user_id))];
    if (studentIds.length === 0) { toast('ยังไม่มีนักเรียนส่งงานในคอร์สนี้', 'warning'); return; }

    // หัวตาราง: ชื่อนักเรียน + การบ้านแต่ละชิ้น + รวม/เต็ม/เปอร์เซ็นต์
    const header = ['ชื่อนักเรียน', ...course.homework.map(hw => hw.title), 'คะแนนรวม', 'คะแนนเต็มรวม', 'เปอร์เซ็นต์'];
    const rows = [header];

    studentIds.forEach(uid => {
        const name = studentNames[uid] || uid;
        const row = [name];
        let totalScore = 0, totalMax = 0;

        course.homework.forEach((hw, idx) => {
            const sub = submissions.find(s => s.user_id === uid && s.homework_index === idx);
            const maxScore = hw.maxScore || 100;
            if (!sub) {
                row.push('ยังไม่ส่ง');
            } else if (sub.status === 'graded') {
                row.push(sub.grade ?? 0);
                totalScore += sub.grade ?? 0;
                totalMax   += maxScore;
            } else {
                row.push('รอตรวจ');
            }
        });

        row.push(totalScore, totalMax, totalMax > 0 ? Math.round((totalScore/totalMax)*100) + '%' : '-');
        rows.push(row);
    });

    // ใส่ BOM (\uFEFF) นำหน้า กัน Excel เปิดแล้วภาษาไทยเพี้ยน (encoding เดา ผิดถ้าไม่มี BOM)
    const csvContent = '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const safeTitle = (course.title || 'course').replace(/[^\p{L}\p{N}\- ]/gu, '').trim() || 'course';
    a.href     = url;
    a.download = `คะแนน-${safeTitle}-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
};

<script>
// ============ A11Y (เพิ่มเติมแยก ไม่แก้ฟังก์ชันเดิม) ============
// หน้าต่างให้คะแนน: Esc ปิด, โฟกัสวนอยู่ในหน้าต่างบนสุด, คืนโฟกัสเมื่อปิด
// แท็บคอร์ส: sync aria-pressed ตาม class .active
(function () {
    var CLOSERS = { gradeModalOverlay: 'closeGradeModal', bulkGradeModalOverlay: 'closeBulkGradeModal' };
    var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
    var stack = [];   // หน้าต่างที่เปิดอยู่ ตัวท้ายสุด = บนสุด (มีแค่ตัวนี้ที่ขังโฟกัส)
    var openers = new Map();
    var app = document.querySelector('.app-container');

    function visible(el) { return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length); }
    function focusables(overlay) {
        return Array.prototype.filter.call(overlay.querySelectorAll(FOCUSABLE), visible);
    }
    function syncInert() {
        var top = stack[stack.length - 1];
        if (app) app.inert = stack.length > 0;
        Object.keys(CLOSERS).forEach(function (id) {
            var ov = document.getElementById(id);
            if (ov) ov.inert = stack.indexOf(ov) !== -1 && ov !== top;
        });
    }
    function onOpen(ov) {
        if (stack.indexOf(ov) !== -1) return;
        openers.set(ov, document.activeElement);
        stack.push(ov);
        syncInert();
        var field = Array.prototype.find.call(
            ov.querySelectorAll('input:not([type="hidden"]):not([disabled]), textarea:not([disabled])'), visible);
        var target = field || focusables(ov)[0];
        if (target) target.focus();
    }
    function onClose(ov) {
        var i = stack.indexOf(ov);
        if (i === -1) return;
        stack.splice(i, 1);
        syncInert();
        var back = openers.get(ov);
        openers.delete(ov);
        var top = stack[stack.length - 1];
        if (back && back.isConnected && visible(back) && (!top || top.contains(back))) {
            back.focus();
        } else if (top) {
            var t = focusables(top)[0];
            if (t && !top.contains(document.activeElement)) t.focus();
        } else {
            // ตารางถูกโหลดใหม่หลังบันทึก ปุ่มเดิมหายไป — คืนโฟกัสที่แท็บคอร์สที่เลือกอยู่แทน
            var tab = document.querySelector('.course-tab-btn.active');
            if (tab) tab.focus();
        }
    }

    Object.keys(CLOSERS).forEach(function (id) {
        var ov = document.getElementById(id);
        if (!ov) return;
        new MutationObserver(function () {
            if (ov.classList.contains('show')) onOpen(ov); else onClose(ov);
        }).observe(ov, { attributes: true, attributeFilter: ['class'] });
    });

    document.addEventListener('keydown', function (e) {
        var top = stack[stack.length - 1];
        if (!top) return;
        if (e.key === 'Escape') {
            // ระหว่างบันทึกคะแนนหลายคน (ปุ่มถูก disable) ไม่ปิด เพื่อไม่ตัดลูปที่กำลังทำงาน
            var busy = top.id === 'bulkGradeModalOverlay' && document.getElementById('btnConfirmBulkGrade').disabled;
            if (busy) return;
            e.preventDefault();
            var fn = window[CLOSERS[top.id]];
            if (typeof fn === 'function') fn();
            return;
        }
        if (e.key !== 'Tab') return;
        var list = focusables(top);
        if (!list.length) { e.preventDefault(); return; }
        var first = list[0], last = list[list.length - 1];
        if (!top.contains(document.activeElement)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    var tabs = document.getElementById('courseTabs');
    function syncPressed() {
        tabs.querySelectorAll('.course-tab-btn').forEach(function (b) {
            b.setAttribute('aria-pressed', b.classList.contains('active') ? 'true' : 'false');
        });
    }
    if (tabs) {
        new MutationObserver(syncPressed).observe(tabs, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
        syncPressed();
    }
})();
</script>
<script src="theme-switcher.js"></script>
<script type="module" src="app-nav.js"></script>
</body>
